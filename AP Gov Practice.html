  {id:1,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"The author of the passage above would most likely agree with which of the following arguments?",choices:["A large republic is better suited to protect minority rights than a small republic.","The proposed Constitution would make it impossible for representatives to adequately reflect the will of their constituents.","Competing factions in a large republic cancel each other out, preventing tyranny.","The Senate's equal state representation is sufficient to protect small states' interests."],correct:1,explanation:"Question 1"},
  {id:2,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"The argument made in this passage most directly contradicts which of the following claims from the Federalist Papers?",choices:["Federalist No. 51's argument that ambition must be made to counteract ambition.","Federalist No. 70's argument that energy in the executive is essential to good government.","Federalist No. 10's argument that a large republic can better control the effects of faction.","Federalist No. 78's argument that the judiciary is the least dangerous branch."],correct:2,explanation:"Question 2"},
  {id:3,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"The author's concern about representation in large republics reflects which model of democracy?",choices:["Elite democracy, because only an educated class can govern effectively.","Participatory democracy, because citizens must directly govern themselves in small units.","Pluralist democracy, because interest groups compete for access to policymakers.","Constitutional democracy, because written rules constrain governmental power."],correct:1,explanation:"Question 3"},
  {id:4,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"Which constitutional development most directly addressed the concern raised in the passage?",choices:["The establishment of the Electoral College to select the president.","The creation of a bicameral legislature with proportional representation in the House.","The addition of the Bill of Rights to protect individual liberties from federal overreach.","The ratification of the Seventeenth Amendment providing for direct election of senators."],correct:2,explanation:"Question 4"},
  {id:5,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"The phrase \"consent of the governed\" in the passage most directly reflects the political philosophy of which Enlightenment thinker?",choices:["Thomas Hobbes, who argued that an absolute sovereign is necessary to prevent anarchy.","Montesquieu, who argued for the separation of governmental powers into three branches.","John Locke, who argued that natural law entitles people to rebel when government violates their rights.","Jean-Jacques Rousseau, who argued that government officials carry out the laws of a free people."],correct:2,explanation:"Question 5"},
  {id:6,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"The Declaration's reference to \"unalienable Rights\" is best described as an application of which political concept?",choices:["Checks and balances — ensuring no branch of government accumulates too much power.","Natural rights — rights that exist independent of and prior to government.","Popular sovereignty — the idea that political authority derives from the people.","Federalism — the division of power between national and state governments."],correct:1,explanation:"Question 6"},
  {id:7,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"Which clause of the U.S. Constitution most directly operationalized the Declaration's concept of \"consent of the governed\"?",choices:["The Supremacy Clause, making federal law supreme over state law.","The Necessary and Proper Clause, granting Congress implied powers.","Article I, Section 2, providing for direct election of the House of Representatives.","The Full Faith and Credit Clause, requiring states to honor other states' legal acts."],correct:2,explanation:"Question 7"},
  {id:8,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"A political scientist argues that the Declaration of Independence contradicted the social reality of the era in which it was written. Which piece of evidence best supports this argument?",choices:["The Declaration was adopted unanimously by the Continental Congress.","The institution of slavery persisted in the colonies despite the Declaration's assertion of equality.","Thomas Jefferson drew extensively from Locke's Second Treatise when drafting the document.","The Declaration listed specific grievances against King George III."],correct:1,explanation:"Question 8"},
  {id:9,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"Under the Articles of Confederation, Congress lacked the power to do which of the following?",choices:["Declare war and negotiate treaties with foreign nations.","Levy taxes directly on citizens to fund the national government.","Admit new states to the confederation.","Settle disputes between two or more states."],correct:1,explanation:"Question 9"},
  {id:10,unit:"Unit 1",topic:"1.1",type:"Multiple Choice",difficulty:"Standard",stem:"Shays' Rebellion (1786–1787) was significant to the Constitutional Convention primarily because it",choices:["demonstrated that states were willing to use military force to suppress dissent.","revealed the Articles of Confederation's inability to maintain domestic order.","convinced Anti-Federalists that a strong central government was dangerous.","showed that the debt from the Revolutionary War had been successfully paid off."],correct:1,explanation:"Question 10"},
  {id:11,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"The Great Compromise (Connecticut Compromise) at the Constitutional Convention resolved a dispute between large and small states by creating",choices:["a bicameral legislature with proportional representation in both chambers.","a bicameral legislature with population-based representation in the House and equal state representation in the Senate.","a unicameral legislature with one vote per state regardless of population.","a bicameral legislature where both chambers would be elected directly by the people."],correct:1,explanation:"Question 11"},
  {id:12,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"The Three-Fifths Compromise in the Constitution reflected which tension present at the Constitutional Convention?",choices:["The tension between large and small states over legislative representation.","The tension between Northern commercial interests and Southern agricultural interests regarding slavery's role in apportioning representation and taxation.","The tension between Federalists and Anti-Federalists over the ratification process.","The tension between states' rights advocates and nationalists over the Supremacy Clause."],correct:1,explanation:"Question 12"},
  {id:13,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"James Madison argued in **Federalist No. 10** that a large republic is superior to a small republic primarily because",choices:["citizens in a large republic are more educated and politically engaged.","a large republic will contain so many factions that no single one can dominate the government.","a large republic makes it easier for citizens to participate directly in government.","a large republic provides greater protection for the natural rights of the wealthy elite."],correct:1,explanation:"Question 13"},
  {id:14,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"Which of the following best describes the key argument of **Federalist No. 51**?",choices:["A single, energetic executive is necessary for effective national governance.","An independent judiciary with life tenure is essential to protect constitutional rights.","The internal structure of government must be designed so that its parts check each other through separated powers and bicameralism.","A large republic can better control the violence of faction than a small one."],correct:2,explanation:"Question 14"},
  {id:15,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"The principle of **judicial review**, not explicitly stated in the Constitution, is most often justified by reference to which foundational document?",choices:["Federalist No. 51, which describes checks and balances between branches.","Federalist No. 78, which argues that courts must have the authority to declare laws void if they contradict the Constitution.","Brutus No. 1, which warns of the judiciary's unchecked power over state courts.","The Declaration of Independence, which establishes the right to alter an unjust government."],correct:1,explanation:"Question 15"},
  {id:16,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"Which of the following is an example of **checks and balances** between the legislative and executive branches?",choices:["Federal courts striking down a state law that conflicts with the U.S. Constitution.","The Senate refusing to confirm a presidential nominee to the Supreme Court.","The House of Representatives passing a bill with a simple majority vote.","A federal agency issuing regulations under a statute passed by Congress."],correct:1,explanation:"Question 16"},
  {id:17,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"The \"double security\" Madison references in the passage above refers to which two structural features of the U.S. government?",choices:["Judicial review and the Bill of Rights.","Federalism and separation of powers.","Bicameralism and the Electoral College.","The amendment process and popular sovereignty."],correct:1,explanation:"Question 17"},
  {id:18,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"Madison's argument in this passage would be most directly challenged by which of the following claims?",choices:["The states have retained too much power over national policy.","When one party controls the presidency and Congress simultaneously, the structural checks described by Madison may be weakened.","The Supreme Court's life tenure makes it the most powerful branch.","The Electoral College subverts the principle of popular sovereignty."],correct:1,explanation:"Question 18"},
  {id:19,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"Which Supreme Court case most directly established the power of federal law over state law, reinforcing the structural relationship described in the passage?",choices:["*Marbury v. Madison* (1803)","*McCulloch v. Maryland* (1819)","*Baker v. Carr* (1962)","*McDonald v. City of Chicago* (2010)"],correct:1,explanation:"Question 19"},
  {id:20,unit:"Unit 1",topic:"1.2",type:"Multiple Choice",difficulty:"Standard",stem:"The concept of federalism described in Federalist No. 51 evolved throughout American history. Which of the following best describes the shift from **dual federalism** to **cooperative federalism**?",choices:["States gained more power relative to the federal government as a result of the Civil War Amendments.","Power came to be shared between the federal and state governments through programs like grants-in-aid, rather than exercised in completely separate spheres.","Federal courts took over state judicial functions through the doctrine of selective incorporation.","The national government eliminated most state authority by invoking the Supremacy Clause repeatedly."],correct:1,explanation:"Question 20"},
  {id:21,unit:"Unit 1",topic:"1.3",type:"Multiple Choice",difficulty:"Standard",stem:"**Categorical grants** differ from **block grants** in that categorical grants",choices:["give states complete discretion over how federal funds are spent.","are only available to state governments, not local governments.","require states to spend funds for specific, federally defined purposes.","are unconstitutional under the Tenth Amendment."],correct:2,explanation:"Question 21"},
  {id:22,unit:"Unit 1",topic:"1.3",type:"Multiple Choice",difficulty:"Standard",stem:"The constitutional basis for **federal mandates** on states is most often derived from which clause?",choices:["The Tenth Amendment's reservation of powers to the states.","The Commerce Clause, which grants Congress the power to regulate interstate commerce.","The Full Faith and Credit Clause.","The Second Amendment's guarantee of the right to bear arms."],correct:1,explanation:"Question 22"},
  {id:23,unit:"Unit 1",topic:"1.3",type:"Multiple Choice",difficulty:"Standard",stem:"An **unfunded mandate** most directly creates tension in the federal system because it",choices:["gives the federal government unlimited authority over state policy.","requires states to implement federal policies without providing adequate financial support to do so.","violates the Supremacy Clause by privileging state law over federal law.","forces Congress to pass laws without the president's signature."],correct:1,explanation:"Question 23"},
  {id:24,unit:"Unit 2",topic:"2.3",type:"Multiple Choice",difficulty:"Standard",stem:"Hamilton's argument in this passage was primarily a response to which concern?",choices:["That the president would be elected by the people rather than by Congress.","That Anti-Federalists feared a single, powerful executive would resemble a monarchy.","That the Senate would dominate foreign policy at the expense of executive authority.","That the Electoral College would produce presidents who lacked popular legitimacy."],correct:1,explanation:"Question 24"},
  {id:25,unit:"Unit 2",topic:"2.3",type:"Multiple Choice",difficulty:"Standard",stem:"Which of the following presidential actions would Hamilton most likely support based on the argument in this passage?",choices:["Deferring to Congress on all foreign policy matters.","Issuing an executive order to implement foreign policy without waiting for Congressional legislation.","Refusing to use the veto to avoid confrontation with Congress.","Delegating all cabinet appointments to the Senate."],correct:1,explanation:"Question 25"},
  {id:26,unit:"Unit 2",topic:"2.3",type:"Multiple Choice",difficulty:"Standard",stem:"A critic of presidential power expansion would most likely argue that the behavior described in Question 25 represents",choices:["an appropriate use of the Necessary and Proper Clause.","a legitimate exercise of the president's role as commander in chief.","an example of the \"imperial presidency\" in which the executive branch oversteps constitutional limits.","a valid application of the War Powers Resolution of 1973."],correct:2,explanation:"Question 26"},
  {id:27,unit:"Unit 2",topic:"2.3",type:"Multiple Choice",difficulty:"Standard",stem:"Which of the following best describes a constitutional check on the executive power Hamilton advocates for?",choices:["The president's role as commander in chief of the armed forces.","Congressional power to override a presidential veto with a two-thirds vote in both chambers.","The president's power to grant pardons and reprieves.","The State of the Union address as a vehicle for presidential communication."],correct:1,explanation:"Question 27"},
  {id:28,unit:"Unit 2",topic:"2.3",type:"Multiple Choice",difficulty:"Standard",stem:"The formal process for removing a federal official from office begins with",choices:["the Senate conducting a trial and voting to convict by a two-thirds majority.","the House of Representatives voting to impeach by a simple majority.","the Supreme Court ruling that an official has committed an impeachable offense.","the president's cabinet voting to invoke the Twenty-Fifth Amendment."],correct:1,explanation:"Question 28"},
  {id:29,unit:"Unit 2",topic:"2.3",type:"Multiple Choice",difficulty:"Standard",stem:"A **filibuster** in the U.S. Senate is best described as",choices:["a procedural rule requiring all legislation to pass committee before a floor vote.","a tactic through which senators engage in extended debate to delay or prevent a vote on legislation.","the process by which the Senate confirms presidential nominations.","the mechanism by which the House attaches riders to appropriations bills."],correct:1,explanation:"Question 29"},
  {id:30,unit:"Unit 2",topic:"2.3",type:"Multiple Choice",difficulty:"Standard",stem:"**Cloture** in the Senate requires a vote of how many senators to end debate?",choices:["A simple majority (51 votes)","Three-fifths (60 votes)","Two-thirds (67 votes)","Three-fourths (75 votes)"],correct:1,explanation:"Question 30"},
  {id:31,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"Which of the following statements about the **Rules Committee** in the House of Representatives is accurate?",choices:["It determines the number of members on each standing committee.","It controls the floor schedule and sets the terms of debate for legislation, giving it significant power over what bills reach a vote.","It is responsible for drafting the federal budget resolution each year.","It functions identically to the Senate's filibuster rule."],correct:1,explanation:"Question 31"},
  {id:32,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"**Divided government** most directly refers to a situation in which",choices:["the two chambers of Congress are controlled by different political parties.","the political party controlling the presidency differs from the party controlling one or both chambers of Congress.","the federal government and a majority of state governments are controlled by different parties.","the president and the Supreme Court hold opposing interpretations of constitutional law."],correct:1,explanation:"Question 32"},
  {id:33,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"The **War Powers Resolution (1973)** was passed primarily to",choices:["grant the president sole authority to commit U.S. forces to combat.","require congressional approval before the president could deploy nuclear weapons.","limit the president's ability to deploy U.S. forces into hostilities without congressional authorization for more than 60 days.","eliminate the Senate's role in ratifying military treaties."],correct:2,explanation:"Question 33"},
  {id:34,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"In *Baker v. Carr* (1962), the Supreme Court ruled that",choices:["racial gerrymandering violates the Equal Protection Clause of the Fourteenth Amendment.","federal courts have jurisdiction to hear cases challenging the apportionment of state legislative districts.","congressional districts must be drawn by independent commissions rather than state legislatures.","the Senate's equal representation of states is unconstitutional."],correct:1,explanation:"Question 34"},
  {id:35,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"In *Shaw v. Reno* (1993), the Supreme Court ruled that",choices:["states must use race-neutral criteria when drawing all congressional districts.","congressional districts drawn primarily on the basis of race are subject to strict scrutiny under the Equal Protection Clause.","the Voting Rights Act of 1965 is unconstitutional as applied to state elections.","racial gerrymandering is permissible when it increases minority representation in Congress."],correct:1,explanation:"Question 35"},
  {id:36,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"Hamilton's description of the judiciary as the \"least dangerous\" branch rests primarily on which argument?",choices:["Federal judges are appointed by the president and confirmed by the Senate.","The judiciary possesses neither the power of the purse (appropriations) nor the power of the sword (military enforcement).","The Supreme Court's decisions can be overridden by a constitutional amendment.","Federal judges serve during \"good behavior,\" insulating them from political pressure."],correct:1,explanation:"Question 36"},
  {id:37,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"Which of the following Supreme Court decisions would most directly challenge Hamilton's claim that the judiciary is the \"least dangerous\" branch?",choices:["*Engel v. Vitale* (1962), ruling government-sponsored prayer in public schools unconstitutional.","*Marbury v. Madison* (1803), establishing judicial review and asserting the Court's power to invalidate acts of Congress.","*Gideon v. Wainwright* (1963), extending the right to counsel to state criminal defendants.","*Tinker v. Des Moines* (1969), ruling that students do not shed constitutional rights at the schoolhouse gate."],correct:1,explanation:"Question 37"},
  {id:38,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"The principle of **stare decisis** is best described as",choices:["the doctrine that the Constitution must be interpreted according to the original intent of the Framers.","the practice of using precedent — prior court decisions — as the basis for deciding current cases.","the ability of Congress to override Supreme Court decisions through legislation.","the requirement that the Supreme Court hear all cases appealed from lower federal courts."],correct:1,explanation:"Question 38"},
  {id:39,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"A judge who subscribes to a **living constitutionalist** interpretation would most likely argue that",choices:["constitutional meaning is fixed at ratification and courts must apply original intent.","the Constitution's broad language allows courts to interpret rights in light of evolving social standards and values.","all constitutional questions should be resolved by elected branches, not courts.","life tenure for judges is unconstitutional because it removes democratic accountability."],correct:1,explanation:"Question 39"},
  {id:40,unit:"Unit 2",topic:"2.4",type:"Multiple Choice",difficulty:"Standard",stem:"The **bureaucracy** is primarily responsible for which governmental function?",choices:["Passing legislation to create federal programs and allocate funding.","Implementing and administering laws and policies passed by Congress.","Reviewing the constitutionality of executive actions and federal statutes.","Negotiating treaties with foreign governments on behalf of the United States."],correct:1,explanation:"Question 40"},
  {id:41,unit:"Unit 2",topic:"2.5",type:"Multiple Choice",difficulty:"Standard",stem:"**Discretionary authority** granted to federal agencies refers to",choices:["the power of Congress to delegate its legislative authority entirely to the executive branch.","the latitude agencies have to make judgments about how best to implement congressional mandates within the scope of their enabling legislation.","the authority of the president to reorganize executive agencies without congressional approval.","the power of agency heads to hire and fire civil servants at will."],correct:1,explanation:"Question 41"},
  {id:42,unit:"Unit 2",topic:"2.5",type:"Multiple Choice",difficulty:"Standard",stem:"An **iron triangle** in the federal policymaking process consists of which three entities?",choices:["The president, the Senate, and the Supreme Court.","A congressional committee, a federal agency, and an interest group with mutual interests in a policy area.","A political party, a media outlet, and a campaign finance organization.","The House, the Senate, and the president — the three actors required to pass legislation."],correct:1,explanation:"Question 42"},
  {id:43,unit:"Unit 2",topic:"2.5",type:"Multiple Choice",difficulty:"Standard",stem:"Congressional oversight of the bureaucracy is carried out through which of the following mechanisms?",choices:["The president's power to reorganize executive agencies.","Committee hearings, the power of the purse (appropriations), and the confirmation process.","Judicial review of agency rulemaking by the Supreme Court.","The War Powers Resolution's 60-day reporting requirement."],correct:1,explanation:"Question 43"},
  {id:44,unit:"Unit 2",topic:"2.5",type:"Multiple Choice",difficulty:"Standard",stem:"The **Civil Service Reform Act of 1883** (Pendleton Act) was significant primarily because it",choices:["created the modern system of congressional committees to oversee the bureaucracy.","replaced the spoils system with a merit-based civil service examination system.","established the power of the president to issue executive orders to the bureaucracy.","created the first independent regulatory commissions to oversee industry."],correct:1,explanation:"Question 44"},
  {id:45,unit:"Unit 2",topic:"2.5",type:"Multiple Choice",difficulty:"Standard",stem:"A **signing statement** issued by the president serves what purpose?",choices:["It formally vetoes a bill passed by Congress.","It is a written comment attached to a signed bill that signals how the president intends to interpret or enforce it.","It triggers a required review by the Supreme Court of the bill's constitutionality.","It conveys the president's message to Congress during the State of the Union address."],correct:1,explanation:"Question 45"},
  {id:46,unit:"Unit 3",topic:"3.5",type:"Multiple Choice",difficulty:"Standard",stem:"The passage most directly reflects which constitutional principle that King used to support the civil rights movement?",choices:["The Second Amendment's protection of the right to bear arms for self-defense.","The Fourteenth Amendment's guarantee of equal protection under the law.","The First Amendment's protection of freedom of religion from government interference.","The Tenth Amendment's reservation of powers to the states."],correct:1,explanation:"Question 46"},
  {id:47,unit:"Unit 3",topic:"3.5",type:"Multiple Choice",difficulty:"Standard",stem:"King's \"Letter from Birmingham Jail\" was written primarily in response to",choices:["a Supreme Court decision upholding segregation in public schools.","white clergy who urged King to pursue change through courts and legislation rather than direct action.","President Kennedy's refusal to support the Civil Rights Act.","Southern governors who threatened to use force against civil rights marchers."],correct:1,explanation:"Question 47"},
  {id:48,unit:"Unit 3",topic:"3.5",type:"Multiple Choice",difficulty:"Standard",stem:"Which of the following best describes how the federal government formally responded to social movements of the type King led?",choices:["The Supreme Court's decision in *Brown v. Board of Education* was the sole governmental response to the civil rights movement.","Congress passed the Civil Rights Act of 1964 and the Voting Rights Act of 1965, translating social movement demands into statutory law.","The executive branch issued executive orders banning segregation in all sectors of public life simultaneously.","The Fourteenth Amendment was ratified specifically in response to King's movement."],correct:1,explanation:"Question 48"},
  {id:49,unit:"Unit 3",topic:"3.5",type:"Multiple Choice",difficulty:"Standard",stem:"The constitutional principle that King's direct action protests implicitly challenged is best described as",choices:["the separation of church and state requiring government neutrality toward religion.","the concept of *de facto* equality — the belief that formal legal equality was already present.","the principle that state governments, not the federal government, have authority over race relations.","the doctrine of judicial supremacy requiring all disputes to be resolved in court."],correct:1,explanation:"Question 49"},
  {id:50,unit:"Unit 3",topic:"3.5",type:"Multiple Choice",difficulty:"Standard",stem:"King's reference to \"an inescapable network of mutuality\" most closely parallels which political concept discussed in AP U.S. Government?",choices:["Federalism — the mutual dependence between state and national governments.","Pluralism — the idea that all groups in society are interconnected and share a stake in just outcomes.","Elite democracy — the belief that educated leaders make better decisions for all.","Participatory democracy — the idea that citizens must directly involve themselves in governance."],correct:1,explanation:"Question 50"},
  {id:51,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"In *Engel v. Vitale* (1962), the Supreme Court ruled that",choices:["students cannot be compelled to recite the Pledge of Allegiance in public schools.","state-sponsored prayer in public schools violates the Establishment Clause of the First Amendment.","the government may not prohibit the free exercise of religion in public spaces.","religious symbols on government property are unconstitutional under all circumstances."],correct:1,explanation:"Question 51"},
  {id:52,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"In *Wisconsin v. Yoder* (1972), the Supreme Court ruled that",choices:["states may require children to attend school through age 16 without exception.","the Free Exercise Clause protects Amish families from being compelled to send their children to high school in violation of their religious beliefs.","religious organizations are exempt from all state and federal regulations.","public school students may not be prohibited from expressing religious views during school hours."],correct:1,explanation:"Question 52"},
  {id:53,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"The **Lemon test**, established in *Lemon v. Kurtzman* (1971), evaluates whether government action violates the Establishment Clause by examining",choices:["whether the law has a secular purpose, does not primarily advance or inhibit religion, and does not create excessive government entanglement with religion.","whether the law compels citizens to practice or refrain from a specific religion.","whether the law was passed with the specific intent of targeting a religious group.","whether the law was supported by a majority of religious organizations during its passage."],correct:0,explanation:"Question 53"},
  {id:54,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"In *Tinker v. Des Moines Independent Community School District* (1969), the Court ruled that",choices:["schools may prohibit all political speech by students during school hours.","students do not shed their constitutional rights at the schoolhouse gate, and symbolic speech such as wearing armbands is protected unless it causes substantial disruption.","student newspapers are subject to prior restraint by school administrators.","the government may regulate \"fighting words\" that incite immediate violence."],correct:1,explanation:"Question 54"},
  {id:55,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"In *Schenck v. United States* (1919), the Supreme Court established the **\"clear and present danger\" test**, which held that",choices:["speech is always protected regardless of its content or likely consequences.","speech may be restricted when it creates a clear and present danger of producing serious harm, such as speech urging resistance to the military draft during wartime.","the government may restrict any speech that is critical of government officials.","seditious libel laws are constitutional under the First Amendment."],correct:1,explanation:"Question 55"},
  {id:56,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"The **\"marketplace of ideas\"** metaphor, often associated with Justice Oliver Wendell Holmes, suggests that",choices:["the government should regulate speech that might be harmful the same way it regulates dangerous consumer products.","the best remedy for harmful or false speech is more speech and open debate rather than government suppression.","only commercially profitable speech deserves First Amendment protection.","political speech may be restricted during wartime when national security is at risk."],correct:1,explanation:"Question 56"},
  {id:57,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"In *New York Times Co. v. United States* (1971), the Supreme Court ruled that",choices:["the government may impose prior restraint on the press when national security is involved.","the press may not be subject to prior restraint except under the most extreme circumstances, and the government failed to meet that burden in preventing publication of the Pentagon Papers.","journalists may not be required to reveal their sources in court.","the First Amendment's freedom of the press does not apply to classified government documents."],correct:1,explanation:"Question 57"},
  {id:58,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"The doctrine of **selective incorporation** refers to",choices:["Congress's authority to pass laws applying the Bill of Rights to private corporations.","the Supreme Court's process of applying specific provisions of the Bill of Rights to state governments through the Fourteenth Amendment's Due Process Clause, case by case.","the executive branch's discretion in enforcing which constitutional rights it will protect.","the requirement that all states adopt the Bill of Rights verbatim into their own constitutions."],correct:1,explanation:"Question 58"},
  {id:59,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"In *McDonald v. City of Chicago* (2010), the Supreme Court incorporated the Second Amendment to the states, meaning",choices:["states must allow all citizens to carry firearms in public without restriction.","the Second Amendment's individual right to possess a firearm for self-defense applies to state and local laws, not just federal law.","cities may not regulate the sale of firearms in any manner.","the right to bear arms is absolute and may not be regulated by any government."],correct:1,explanation:"Question 59"},
  {id:60,unit:"Unit 3",topic:"3.6",type:"Multiple Choice",difficulty:"Standard",stem:"In *Gideon v. Wainwright* (1963), the Supreme Court ruled that",choices:["a defendant may not be tried twice for the same crime (double jeopardy).","confessions obtained without informing a suspect of their rights are inadmissible.","the Sixth Amendment right to counsel must be provided to all criminal defendants in state courts, even those who cannot afford an attorney.","evidence obtained through an illegal search must be excluded from trial."],correct:2,explanation:"Question 60"},
  {id:61,unit:"Unit 3",topic:"3.7",type:"Multiple Choice",difficulty:"Standard",stem:"The **exclusionary rule**, preventing illegally obtained evidence from being used in court, was extended to state criminal proceedings in",choices:["*Gideon v. Wainwright* (1963)","*Mapp v. Ohio* (1961)","*Miranda v. Arizona* (1966)","*McDonald v. City of Chicago* (2010)"],correct:1,explanation:"Question 61"},
  {id:62,unit:"Unit 3",topic:"3.7",type:"Multiple Choice",difficulty:"Standard",stem:"*Roe v. Wade* (1973) located the constitutional right to privacy, on which the abortion right rested, in",choices:["the First Amendment's guarantee of freedom of conscience.","the penumbras and emanations of several Bill of Rights guarantees, as articulated in *Griswold v. Connecticut* (1965), applied through the Fourteenth Amendment's Due Process Clause.","the Ninth Amendment's reservation of rights to the people.","the Tenth Amendment's reservation of powers to the states."],correct:1,explanation:"Question 62"},
  {id:63,unit:"Unit 3",topic:"3.7",type:"Multiple Choice",difficulty:"Standard",stem:"**Affirmative action** policies in college admissions have been constitutionally challenged primarily on the basis of which constitutional provision?",choices:["The First Amendment's guarantee of freedom of association.","The Fourteenth Amendment's Equal Protection Clause.","The Fifth Amendment's protection against self-incrimination.","The Tenth Amendment's reservation of powers to the states."],correct:1,explanation:"Question 63"},
  {id:64,unit:"Unit 4",topic:"4.7",type:"Multiple Choice",difficulty:"Standard",stem:"**Political socialization** is best defined as",choices:["the process by which political parties recruit new members.","the process through which individuals form their political attitudes, values, and beliefs over time.","the formal civics education required by state governments.","the influence of social media on political behavior."],correct:1,explanation:"Question 64"},
  {id:65,unit:"Unit 4",topic:"4.7",type:"Multiple Choice",difficulty:"Standard",stem:"Research consistently identifies which of the following as the **most influential** agent of political socialization?",choices:["Peer groups and social networks.","The family, particularly parents.","Secondary school civic education.","Religious institutions."],correct:1,explanation:"Question 65"},
  {id:66,unit:"Unit 4",topic:"4.7",type:"Multiple Choice",difficulty:"Standard",stem:"**Generational effects** on political ideology differ from **lifecycle effects** in that",choices:["generational effects refer to changes in beliefs as people age, while lifecycle effects refer to shared experiences of a birth cohort.","lifecycle effects refer to changes in beliefs as people age, while generational effects refer to how shared historical experiences shape an entire birth cohort's political outlook.","generational effects are more powerful than lifecycle effects in determining party identification.","lifecycle effects are unique to democratic societies; generational effects are universal."],correct:1,explanation:"Question 66"},
  {id:67,unit:"Unit 4",topic:"4.7",type:"Multiple Choice",difficulty:"Standard",stem:"Which of the following is an example of a **generational effect** on political ideology?",choices:["Young people becoming more conservative as they acquire property and start families.","Millennials developing more positive attitudes toward government activism because many came of age during the 2008 financial crisis and the expansion of social programs.","Senior citizens becoming more liberal as they rely more heavily on government programs like Medicare.","College-educated voters shifting toward the Democratic Party because of higher income."],correct:1,explanation:"Question 67"},
  {id:68,unit:"Unit 4",topic:"4.7",type:"Multiple Choice",difficulty:"Standard",stem:"The **gender gap** in political opinion refers to which consistent pattern?",choices:["Men are more likely to support gun control legislation than women.","Women are consistently more likely than men to identify as liberal and support Democratic candidates.","Women's political participation rates are significantly lower than men's in national elections.","Men are more likely to vote in primary elections, giving them disproportionate influence over nominee selection."],correct:1,explanation:"Question 68"},
  {id:69,unit:"Unit 4",topic:"4.7",type:"Multiple Choice",difficulty:"Standard",stem:"Based on the data, which age group shows the highest percentage of self-identified conservatives?",choices:["18–29 years old","30–49 years old","50–64 years old","65 and older"],correct:3,explanation:"Question 69"},
  {id:70,unit:"Unit 4",topic:"4.7",type:"Multiple Choice",difficulty:"Standard",stem:"The pattern shown in the data is most consistent with which political science concept?",choices:["The generational effect — each cohort was shaped by different formative historical experiences.","The lifecycle effect — people tend to become more conservative as they age.","Political socialization by family — older Americans inherited conservative beliefs from their parents.","The gender gap — older voters skew male and males are more conservative."],correct:1,explanation:"Question 70"},
  {id:71,unit:"Unit 4",topic:"4.8",type:"Multiple Choice",difficulty:"Standard",stem:"A political scientist cautions that the data alone **cannot** definitively distinguish between lifecycle and generational effects. Which methodological approach would best clarify this?",choices:["Conducting a larger survey with a bigger sample size.","Tracking the same cohorts over time (a longitudinal panel study) to see whether their ideology changes as they age.","Comparing the data to similar surveys from other democratic countries.","Controlling for income levels among each age group."],correct:1,explanation:"Question 71"},
  {id:72,unit:"Unit 4",topic:"4.8",type:"Multiple Choice",difficulty:"Standard",stem:"Based on the data, which of the following predictions about electoral behavior is most well-supported?",choices:["Voters 65 and older will vote in lower numbers than younger voters.","Candidates running on a liberal platform are likely to receive more support from voters 18–29 than from voters 65+.","Moderate voters are likely to vote for third-party candidates at higher rates than liberals or conservatives.","Conservative voters are less likely to vote in midterm elections than presidential elections."],correct:1,explanation:"Question 72"},
  {id:73,unit:"Unit 4",topic:"4.8",type:"Multiple Choice",difficulty:"Standard",stem:"A **random sample** in polling is important primarily because it",choices:["guarantees that every respondent will answer all questions honestly.","ensures that every member of the population has an equal chance of being selected, making the sample more likely to represent the population accurately.","eliminates the margin of error in survey results.","ensures that the pollster's questions are free of bias."],correct:1,explanation:"Question 73"},
  {id:74,unit:"Unit 4",topic:"4.8",type:"Multiple Choice",difficulty:"Standard",stem:"**Push polling** differs from legitimate scientific polling because it",choices:["uses a larger sample size than standard polls.","asks leading questions designed to influence respondents' opinions rather than measure them, functioning as a campaign tactic rather than genuine measurement.","focuses exclusively on likely voters rather than all registered voters.","is conducted online rather than by phone or in person."],correct:1,explanation:"Question 74"},
  {id:75,unit:"Unit 4",topic:"4.8",type:"Multiple Choice",difficulty:"Standard",stem:"The **margin of error** in a scientific poll means that",choices:["the poll's results are guaranteed to be inaccurate by that percentage.","the true value in the population falls within the stated range around the poll's result with a specified level of confidence (usually 95%).","the poll was conducted with a non-random sample.","more than the stated percentage of respondents refused to answer certain questions."],correct:1,explanation:"Question 75"},
  {id:76,unit:"Unit 4",topic:"4.8",type:"Multiple Choice",difficulty:"Standard",stem:"Compared to **conservatives**, **liberals** in the United States are more likely to favor",choices:["reducing the size and scope of the federal government's domestic programs.","deregulation of the economy and lower tax rates.","government intervention in the economy to address inequality and the expansion of social safety net programs.","a strict constructionist interpretation of the Constitution."],correct:2,explanation:"Question 76"},
  {id:77,unit:"Unit 4",topic:"4.8",type:"Multiple Choice",difficulty:"Standard",stem:"On **social issues**, the traditional conservative position tends to favor",choices:["expanding government programs to promote social equality.","maintaining traditional social institutions and values, with skepticism toward rapid social change.","legalizing all consensual adult behaviors regardless of social norms.","stronger federal civil rights protections for minority groups."],correct:1,explanation:"Question 77"},
  {id:78,unit:"Unit 4",topic:"4.8",type:"Multiple Choice",difficulty:"Standard",stem:"A politician who advocates for free-market economics with minimal government regulation but also supports individual social freedoms like marriage equality would be best described ideologically as",choices:["A traditional conservative.","A progressive liberal.","A libertarian.","A moderate Democrat."],correct:2,explanation:"Question 78"},
  {id:79,unit:"Unit 5",topic:"5.8",type:"Multiple Choice",difficulty:"Standard",stem:"The **Fifteenth Amendment** (1870) extended voting rights by prohibiting denial of the right to vote based on",choices:["sex.","age (for citizens 18 and older).","race, color, or previous condition of servitude.","property ownership or poll tax payment."],correct:2,explanation:"Question 79"},
  {id:80,unit:"Unit 5",topic:"5.8",type:"Multiple Choice",difficulty:"Standard",stem:"The **Nineteenth Amendment** (1920) guaranteed",choices:["the right to vote for citizens 18 years of age and older.","the right to vote regardless of race or color.","the right of women to vote.","the abolition of poll taxes in federal elections."],correct:2,explanation:"Question 80"},

// ── PRACTICE SCREEN ────────────────────────────────────────────
const PracticeScreen = ({ progress, setProgress, dark, initialTopic, onOpenStimulusModal }) => {
  const initFilters = () => {
    if (initialTopic) {
      if (initialTopic.startsWith('Unit ')) {
        const unitNum = initialTopic.split(' ')[1];
        return { unit:`Unit ${unitNum}`, type:'All', diff:'All', review:'all', topicNum:null };
      } else {
        const topicNum = initialTopic.split(' ')[0];
        return { unit:'All', type:'All', diff:'All', review:'all', topicNum };
      }
    }
    return { unit:'All', type:'All', diff:'All', review:'all', topicNum:null };
  };

  const [filters,       setFilters]       = React.useState(initFilters);
  const [qIndex,        setQIndex]        = React.useState(0);
  const [sessionCorrect,setSessionCorrect]= React.useState(0);
  const [sessionTotal,  setSessionTotal]  = React.useState(0);
  const [shuffled,      setShuffled]      = React.useState(false);
  const [order,         setOrder]         = React.useState(ALL_QUESTIONS.map((_,i)=>i));
  const [bookmarks,     setBookmarks]     = React.useState(window.getBookmarks?window.getBookmarks():{});
  const [streak,        setStreak]        = React.useState(0);
  const [showCelebration,setShowCelebration]=React.useState(false);

  React.useEffect(()=>{ setFilters(initFilters()); setQIndex(0); }, [initialTopic]);

  const answers = progress.answers||{};
  const filtered = order.map(i=>ALL_QUESTIONS[i]).filter(q=>{
    if(filters.unit!=='All'&&q.unit!==filters.unit) return false;
    if(filters.type!=='All'&&q.type!==filters.type) return false;
    if(filters.diff!=='All'&&q.difficulty!==filters.diff) return false;
    if(filters.topicNum&&q.topic!==filters.topicNum) return false;
    if(filters.review==='wrong') return answers[q.id]&&!answers[q.id].correct;
    if(filters.review==='bookmarked') return !!bookmarks[q.id];
    return true;
  });

  const safeidx  = filtered.length>0?Math.min(qIndex,filtered.length-1):0;
  const currentQ = filtered[safeidx];
  const acc      = sessionTotal>0?Math.round((sessionCorrect/sessionTotal)*100):null;

  const handleAnswer = (wasCorrect, q) => {
    setSessionTotal(t=>t+1);
    const ns = wasCorrect?streak+1:0;
    setStreak(ns);
    if(wasCorrect) {
      setSessionCorrect(c=>c+1);
      if(ns>0&&ns%5===0){setShowCelebration(true);setTimeout(()=>setShowCelebration(false),3000);}
    }
    setProgress(prev=>{
      const ans={...(prev.answers||{}),[q.id]:{correct:wasCorrect,timestamp:Date.now()}};
      const recent=[{label:`${q.unit} · ${q.type}`,type:q.type,when:'Just now',correct:wasCorrect},...(prev.recent||[]).slice(0,5)];
      return{...prev,answers:ans,recent,streak:wasCorrect?(prev.streak||0)+1:0};
    });
    setBookmarks(window.getBookmarks?window.getBookmarks():{});
  };

  const goNext=()=>{ const n=(safeidx+1)%Math.max(filtered.length,1); setQIndex(n); localStorage.setItem('apgov_qidx',String(n)); };
  const goPrev=()=>{ const n=(safeidx-1+Math.max(filtered.length,1))%Math.max(filtered.length,1); setQIndex(n); };
  const handleShuffle=()=>{ setOrder(o=>[...o].sort(()=>Math.random()-0.5)); setQIndex(0); setShuffled(true); };
  const handleFiltersChange=(f)=>{ setFilters(f); setQIndex(0); };

  const bg   = dark?'#0D1421':'#F8F9FB';
  const card = dark?'#111B2B':'#fff';
  const bord = dark?'#1E2D42':'#EEF0F4';
  const textP= dark?'#E8ECF0':'#1A2030';
  const textM= dark?'#9BA5B2':'#9BA5B2';

  return (
    <div style={{ display:'flex',flexDirection:'column',flex:1,overflow:'hidden' }}>
      <FilterPanel
        filters={filters} onFiltersChange={handleFiltersChange}
        onShuffle={handleShuffle} shuffled={shuffled}
        sessionInfo={{acc,sessionTotal,streak}} dark={dark} questionCount={filtered.length}
      />

      {/* Topic/Unit filter indicator */}
      {(filters.topicNum || filters.unit !== 'All') && (
        <div style={{ background:dark?'#162236':'#EBF2F9',padding:'8px 24px',display:'flex',alignItems:'center',gap:10,flexShrink:0,borderBottom:`1px solid ${dark?'#1E2D42':'#A3C4DF'}` }}>
          <span style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,color:dark?'#8BAED4':'#2D5D8B' }}>
            Showing questions for <strong>{filters.topicNum ? `Topic ${filters.topicNum}` : filters.unit}</strong>
          </span>
          <button onClick={()=>setFilters(f=>({...f,topicNum:null,unit:'All'}))}
            style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:11,fontWeight:600,color:dark?'#748092':'#9BA5B2',background:'none',border:'none',cursor:'pointer',marginLeft:'auto' }}>
            Clear ✕
          </button>
        </div>
      )}

      {/* Celebration banner */}
      {showCelebration&&(
        <div className="anim-celebration" style={{ background:'linear-gradient(90deg,#C9A84C,#E8C96A,#C9A84C)',padding:'10px 24px',textAlign:'center',fontFamily:"'Source Sans 3',Arial,sans-serif",fontWeight:700,fontSize:14,color:'#1B2A4A',flexShrink:0 }}>
          🎉 {streak} in a row — you're on fire! Keep going!
        </div>
      )}

      <div style={{ flex:1,overflowY:'auto',padding:'24px 28px',background:bg }}>
        {filtered.length===0 ? (
          <div style={{ textAlign:'center',padding:48 }}>
            <div style={{ fontSize:'2.5rem',marginBottom:12 }}>🔍</div>
            <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:15,fontWeight:600,color:textP,marginBottom:8 }}>No questions match this filter</div>
            <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:13,color:textM,marginBottom:20 }}>
              {filters.review==='wrong'?'Answer more questions to build your review list.':filters.review==='bookmarked'?'Bookmark questions (★) to find them here.':'Try a different filter combination.'}
            </div>
            <button onClick={()=>setFilters({unit:'All',type:'All',diff:'All',review:'all',topicNum:null})}
              style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:13,fontWeight:600,padding:'8px 20px',borderRadius:7,border:'none',background:'#1B2A4A',color:'#fff',cursor:'pointer' }}>Reset Filters</button>
          </div>
        ) : currentQ && (
          <div style={{ display:'flex',gap:22,alignItems:'flex-start' }}>
            <div style={{ flex:1,maxWidth:700 }}>
              {/* Progress bar */}
              <div style={{ display:'flex',alignItems:'center',gap:12,marginBottom:14 }}>
                <div style={{ flex:1,background:dark?'#1E2D42':'#EEF0F4',borderRadius:9999,height:5,overflow:'hidden' }}>
                  <div style={{ height:'100%',borderRadius:9999,background:'#1B2A4A',width:`${((safeidx+1)/filtered.length)*100}%`,transition:'width 400ms ease' }}/>
                </div>
                <span style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,color:textM,whiteSpace:'nowrap' }}>{safeidx+1} / {filtered.length}</span>
                <button onClick={goPrev} style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,padding:'5px 11px',borderRadius:6,border:`1.5px solid ${bord}`,background:card,color:dark?'#9BA5B2':'#5A6779',cursor:'pointer' }}>←</button>
                <button onClick={goNext} style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,padding:'5px 11px',borderRadius:6,border:`1.5px solid ${bord}`,background:card,color:dark?'#9BA5B2':'#5A6779',cursor:'pointer' }}>→</button>
              </div>
              <div className="anim-slideUp">
                <QuestionCard questionIndex={safeidx} totalQuestions={filtered.length} onNext={goNext} onPrev={goPrev} onAnswer={handleAnswer} questionBank={filtered} dark={dark} onOpenStimulusModal={onOpenStimulusModal} />
              </div>
            </div>

            {/* Right sidebar */}
            <div style={{ width:210,flexShrink:0 }}>
              <div style={{ background:card,borderRadius:10,border:`1px solid ${bord}`,padding:'14px 16px',marginBottom:12 }}>
                <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',color:dark?'#374B60':'#BFC6D0',marginBottom:10 }}>Session</div>
                {[['Answered',sessionTotal,'#E8ECF0'],['Correct',sessionCorrect,'#2A7A4B'],['Accuracy',acc!==null?`${acc}%`:'—',acc!==null&&acc>=70?'#2A7A4B':'#D97706'],['Streak',streak>0?`${streak} 🔥`:'—','#C9A84C']].map(([l,v,c])=>(
                  <div key={l} style={{ display:'flex',justifyContent:'space-between',marginBottom:6 }}>
                    <span style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,color:textM }}>{l}</span>
                    <span style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,fontWeight:700,color:c }}>{v}</span>
                  </div>
                ))}
              </div>
              <div style={{ background:dark?'#0F1829':'#F5F0E8',borderRadius:10,padding:'12px 14px',borderLeft:'4px solid #C9A84C' }}>
                <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',color:textM,marginBottom:6 }}>AP Exam Tip</div>
                <p style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,color:dark?'#C8D4E0':'#404E60',lineHeight:1.55 }}>For stimulus questions: identify the author and source FIRST. Ask yourself: what argument is this source making, and which answer choice best reflects that argument?</p>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// ── PROGRESS SCREEN ────────────────────────────────────────────
const ProgressScreen = ({ progress, dark, onNavigate }) => {
  const [activeUnit, setActiveUnit] = React.useState(1);
  const answers = progress.answers||{};
  const totalAnswered = Object.keys(answers).length;
  const totalCorrect  = Object.values(answers).filter(a=>a.correct).length;
  const overallAcc    = totalAnswered>0?Math.round((totalCorrect/totalAnswered)*100):0;

  const bg   = dark?'#0D1421':'#F8F9FB';
  const card = dark?'#111B2B':'#fff';
  const bord = dark?'#1E2D42':'#EEF0F4';
  const textP= dark?'#E8ECF0':'#1A2030';
  const textM= dark?'#9BA5B2':'#9BA5B2';
  const unitColors=['#1B2A4A','#2D5D8B','#B22234','#C9A84C','#2A7A4B'];
  const unitTitles=['Foundations of American Democracy','Interactions Among Branches of Government','Civil Liberties and Civil Rights','American Political Ideologies and Beliefs','Political Participation'];

  // Per-unit stats
  const unitStats = [1,2,3,4,5].map(uid=>{
    const uQs = ALL_QUESTIONS.filter(q=>q.unit===`Unit ${uid}`);
    const ans  = uQs.filter(q=>answers[q.id]);
    const cor  = ans.filter(q=>answers[q.id]?.correct);
    // Per-topic breakdown
    const topics = [...new Set(uQs.map(q=>q.topic))].map(t=>{
      const tQs  = uQs.filter(q=>q.topic===t);
      const tAns = tQs.filter(q=>answers[q.id]);
      const tCor = tAns.filter(q=>answers[q.id]?.correct);
      return { topic:t, total:tQs.length, done:tAns.length, correct:tCor.length };
    }).sort((a,b)=>a.topic.localeCompare(b.topic, undefined, {numeric:true}));
    // Per-type breakdown
    const types = [...new Set(uQs.map(q=>q.type))].map(ty=>{
      const tyQs  = uQs.filter(q=>q.type===ty);
      const tyAns = tyQs.filter(q=>answers[q.id]);
      const tyCor = tyAns.filter(q=>answers[q.id]?.correct);
      return { type:ty, total:tyQs.length, done:tyAns.length, correct:tyCor.length };
    });
    return {id:uid,title:unitTitles[uid-1],total:uQs.length,done:ans.length,correct:cor.length,topics,types};
  });

  const u = unitStats[activeUnit-1];
  const uAcc = u.done>0?Math.round((u.correct/u.done)*100):null;
  const uColor = unitColors[activeUnit-1];
  const wrongQs = ALL_QUESTIONS.filter(q=>q.unit===`Unit ${activeUnit}`&&answers[q.id]&&!answers[q.id].correct);

  return (
    <div style={{ overflowY:'auto',flex:1,background:bg }}>
      {/* Overall summary strip */}
      <div style={{ background:dark?'#111B2B':'#fff',borderBottom:`1px solid ${bord}`,padding:'16px 28px',display:'flex',gap:20,alignItems:'center' }}>
        <div style={{ display:'flex',gap:16 }}>
          {[
            {l:'Total Answered',v:totalAnswered,c:'#1B2A4A'},
            {l:'Correct',       v:totalCorrect, c:'#2A7A4B'},
            {l:'Overall Accuracy',v:totalAnswered?`${overallAcc}%`:'—',c:overallAcc>=70?'#2A7A4B':overallAcc>0?'#D97706':'#748092'},
            {l:'Terms Studied', v:progress.termsStudied||0,c:'#C9A84C'},
          ].map(s=>(
            <div key={s.l} style={{ textAlign:'center' }}>
              <div style={{ fontFamily:"'Playfair Display',Georgia,serif",fontSize:'1.6rem',fontWeight:700,color:s.c,lineHeight:1 }}>{s.v}</div>
              <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,color:textM,marginTop:3 }}>{s.l}</div>
            </div>
          ))}
        </div>
        {/* Overall bar */}
        <div style={{ flex:1,maxWidth:300 }}>
          <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:textM,marginBottom:5 }}>Overall Progress</div>
          <div style={{ background:dark?'#1E2D42':'#EEF0F4',borderRadius:9999,height:10,overflow:'hidden' }}>
            <div className="prog-bar-fill" style={{ width:`${totalAnswered?Math.round((totalAnswered/ALL_QUESTIONS.length)*100):0}%`,height:'100%',background:'#1B2A4A' }}/>
          </div>
          <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:11,color:textM,marginTop:4 }}>
            {totalAnswered} / {ALL_QUESTIONS.length} questions attempted
          </div>
        </div>
      </div>

      <div style={{ padding:'24px 28px' }}>
        <h2 style={{ fontFamily:"'Playfair Display',Georgia,serif",fontSize:'1.3rem',fontWeight:700,color:textP,marginBottom:18 }}>Unit Progress</h2>

        {/* Unit tabs */}
        <div style={{ display:'flex',gap:8,marginBottom:24,flexWrap:'wrap' }}>
          {unitStats.map(us=>{
            const uacc=us.done>0?Math.round((us.correct/us.done)*100):null;
            const isActive=activeUnit===us.id;
            return (
              <button key={us.id} onClick={()=>setActiveUnit(us.id)}
                style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12.5,fontWeight:700,padding:'9px 16px',borderRadius:9,border:`2px solid ${isActive?unitColors[us.id-1]:(dark?'#253447':'#DDE1E9')}`,background:isActive?unitColors[us.id-1]:(dark?'#111B2B':'#fff'),color:isActive?'#fff':(dark?'#9BA5B2':'#5A6779'),cursor:'pointer',transition:'all 150ms',display:'flex',flexDirection:'column',alignItems:'center',gap:3,minWidth:90 }}>
                <span>Unit {us.id}</span>
                {uacc!==null&&<span style={{ fontSize:11,fontWeight:600,color:isActive?'rgba(255,255,255,0.8)':uacc>=70?'#2A7A4B':'#D97706' }}>{uacc}%</span>}
                {uacc===null&&<span style={{ fontSize:10,color:isActive?'rgba(255,255,255,0.5)':textM }}>Not started</span>}
              </button>
            );
          })}
        </div>

        {/* Active unit detail */}
        <div className="anim-fadeIn" key={activeUnit}>
          <div style={{ background:card,borderRadius:12,border:`1px solid ${bord}`,padding:'20px 22px',marginBottom:20 }}>
            <div style={{ display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16 }}>
              <div>
                <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',color:uColor,marginBottom:4 }}>Unit {activeUnit}</div>
                <div style={{ fontFamily:"'Playfair Display',Georgia,serif",fontSize:'1.1rem',fontWeight:700,color:textP }}>{u.title}</div>
              </div>
              <div style={{ textAlign:'right' }}>
                <div style={{ fontFamily:"'Playfair Display',Georgia,serif",fontSize:'1.8rem',fontWeight:700,color:uAcc!==null?(uAcc>=70?'#2A7A4B':'#D97706'):'#748092',lineHeight:1 }}>
                  {uAcc!==null?`${uAcc}%`:'—'}
                </div>
                <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:11,color:textM }}>{u.done} / {u.total} answered</div>
              </div>
            </div>
            <div style={{ background:dark?'#1E2D42':'#EEF0F4',borderRadius:9999,height:10,overflow:'hidden',marginBottom:6 }}>
              <div className="prog-bar-fill" style={{ width:`${u.total>0?Math.round((u.done/u.total)*100):0}%`,height:'100%',background:uColor }}/>
            </div>
            <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:11,color:textM }}>{u.total>0?Math.round((u.done/u.total)*100):0}% of unit questions attempted</div>
          </div>

          <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20 }}>
            {/* By topic */}
            <div style={{ background:card,borderRadius:10,border:`1px solid ${bord}`,padding:'16px 18px' }}>
              <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',color:textM,marginBottom:12 }}>By Topic</div>
              {u.topics.length===0&&<div style={{ fontSize:12,color:textM,fontFamily:"'Source Sans 3',Arial,sans-serif" }}>No questions in this unit yet.</div>}
              {u.topics.map(t=>{
                const pct=t.done>0?Math.round((t.correct/t.done)*100):null;
                return (
                  <div key={t.topic} style={{ marginBottom:10 }}>
                    <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4 }}>
                      <span style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,fontWeight:600,color:textP }}>Topic {t.topic}</span>
                      <span style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:11,color:pct!==null?(pct>=70?'#2A7A4B':'#D97706'):textM }}>
                        {pct!==null?`${pct}%`:t.done===0?'Not started':'—'} · {t.done}/{t.total}
                      </span>
                    </div>
                    <div style={{ background:dark?'#1E2D42':'#EEF0F4',borderRadius:9999,height:5,overflow:'hidden' }}>
                      <div className="prog-bar-fill" style={{ width:`${t.total>0?Math.round((t.done/t.total)*100):0}%`,height:'100%',background:uColor }}/>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* By type */}
            <div style={{ background:card,borderRadius:10,border:`1px solid ${bord}`,padding:'16px 18px' }}>
              <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',color:textM,marginBottom:12 }}>By Question Type</div>
              {u.types.map(t=>{
                const pct=t.done>0?Math.round((t.correct/t.done)*100):null;
                const tc={'SCOTUS':'#2D5D8B','Stimulus-Based':'#5A2D8B','Data Analysis':'#1B2A4A','SCOTUS Comparison':'#8B2D5A','Comparison':'#374B60','Concept Application':'#748092','Quantitative Analysis':'#2A7A4B'}[t.type]||'#748092';
                return (
                  <div key={t.type} style={{ display:'flex',alignItems:'center',gap:10,marginBottom:9 }}>
                    <div style={{ width:8,height:8,borderRadius:'50%',background:tc,flexShrink:0 }}/>
                    <div style={{ flex:1 }}>
                      <div style={{ display:'flex',justifyContent:'space-between',marginBottom:3 }}>
                        <span style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,color:textP }}>{t.type}</span>
                        <span style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:11,color:pct!==null?(pct>=70?'#2A7A4B':'#D97706'):textM }}>
                          {pct!==null?`${pct}%`:'—'}
                        </span>
                      </div>
                      <div style={{ background:dark?'#1E2D42':'#EEF0F4',borderRadius:9999,height:4,overflow:'hidden' }}>
                        <div className="prog-bar-fill" style={{ width:`${t.total>0?Math.round((t.done/t.total)*100):0}%`,height:'100%',background:tc }}/>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Wrong questions for this unit */}
          {wrongQs.length>0&&(
            <div style={{ background:dark?'#2E0F0F':'#FEF3C7',borderRadius:10,padding:'14px 18px',border:`1px solid ${dark?'#5A2020':'#FCD34D'}` }}>
              <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',color:'#D97706',marginBottom:10 }}>Needs Review — Unit {activeUnit} ({wrongQs.length} questions)</div>
              <div style={{ display:'flex',gap:7,flexWrap:'wrap' }}>
                {wrongQs.map(q=>(
                  <span key={q.id} style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:11.5,fontWeight:600,padding:'4px 12px',borderRadius:9999,background:dark?'#3E1A00':'#FEF3C7',color:'#D97706',border:'1px solid #FCD34D',cursor:'pointer' }}
                    onClick={()=>onNavigate('practice')}>
                    Topic {q.topic}
                  </span>
                ))}
              </div>
            </div>
          )}
          {u.done===0&&(
            <div style={{ textAlign:'center',padding:32,background:card,borderRadius:10,border:`1px solid ${bord}` }}>
              <div style={{ fontSize:32,marginBottom:10 }}>📚</div>
              <div style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:14,color:textP,marginBottom:8 }}>No questions answered for Unit {activeUnit} yet</div>
              <button onClick={()=>onNavigate('practice')} style={{ fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:13,fontWeight:700,padding:'9px 20px',borderRadius:7,border:'none',background:uColor,color:'#fff',cursor:'pointer' }}>
                Start Unit {activeUnit} Practice →
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ── SCOTUS / AMENDMENTS / ARTICLES / VOCAB / DOCS SCREENS ─────
const SectionPage=({title,subtitle,children,dark})=>{
  const bg=dark?'#0D1421':'#F8F9FB',textP=dark?'#E8ECF0':'#1A2030',textM=dark?'#9BA5B2':'#9BA5B2';
  return(<div style={{padding:'28px 32px',overflowY:'auto',flex:1,background:bg}}><div style={{marginBottom:22}}><h2 style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:'1.4rem',fontWeight:700,color:textP,marginBottom:4}}>{title}</h2>{subtitle&&<p style={{fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:13,color:textM}}>{subtitle}</p>}</div>{children}</div>);
};
const ScotusScreen=({dark})=><SectionPage dark={dark} title="Must-Know Supreme Court Cases" subtitle="15 required cases — facts, rulings, significance"><ScotosList dark={dark}/></SectionPage>;
const AmendmentsScreen=({dark})=><SectionPage dark={dark} title="Constitutional Amendments" subtitle="All 27 — browse, flashcard (forward & reverse), quiz"><AmendmentsSection dark={dark}/></SectionPage>;
const ArticlesScreen=({dark})=><SectionPage dark={dark} title="Articles of the Constitution" subtitle="All 7 articles — sections, key terms, flashcards, quiz"><ArticlesSection dark={dark}/></SectionPage>;
const VocabScreen=({dark,setProgress})=><SectionPage dark={dark} title="Key Vocabulary" subtitle="75+ essential terms across 5 units"><VocabSection dark={dark} onStudied={()=>setProgress(p=>({...p,termsStudied:(p.termsStudied||0)+1}))}/></SectionPage>;

// ── DOCS SCREEN ────────────────────────────────────────────────
const DocsScreen=({dark})=>{
  const[sel,setSel]=React.useState(FOUND_DOCS[0]);
  const bg=dark?'#0D1421':'#F8F9FB',card=dark?'#111B2B':'#fff',bord=dark?'#1E2D42':'#EEF0F4',textP=dark?'#E8ECF0':'#1A2030',textS=dark?'#C8D4E0':'#404E60',textM=dark?'#9BA5B2':'#9BA5B2';
  return(<div style={{padding:'28px 32px',overflowY:'auto',flex:1,background:bg}}>
    <h2 style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:'1.4rem',fontWeight:700,color:textP,marginBottom:4}}>Foundational Documents</h2>
    <p style={{fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:13,color:textM,marginBottom:22}}>Required primary sources for the AP exam</p>
    <div style={{display:'flex',gap:20}}>
      <div style={{display:'flex',flexDirection:'column',gap:8,width:220,flexShrink:0}}>
        {FOUND_DOCS.map(doc=>(
          <div key={doc.title} onClick={()=>setSel(doc)} style={{background:card,borderRadius:8,border:`1.5px solid ${sel.title===doc.title?doc.color:bord}`,borderLeft:`4px solid ${sel.title===doc.title?doc.color:'transparent'}`,padding:'11px 13px',cursor:'pointer',transition:'all 150ms'}}>
            <div style={{fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,color:textM,marginBottom:2}}>{doc.year}</div>
            <div style={{fontFamily:"'Playfair Display',Georgia,serif",fontSize:'0.9rem',fontWeight:700,color:textP,lineHeight:1.3}}>{doc.title}</div>
            <div style={{fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,color:textM,marginTop:2}}>{doc.unit}</div>
          </div>
        ))}
      </div>

          <div style={{width:34,height:34,borderRadius:8,background:item.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,color:'#fff',flexShrink:0,fontFamily:"'Playfair Display',Georgia,serif",fontWeight:700}}>{item.icon}</div>
