// ── TABS ───────────────────────────────────────────────────────
const TABS=[{l:'Dashboard',s:'dashboard'},{l:'Topic Study',s:'topic'},{l:'Practice',s:'practice'},{l:'Amendments',s:'amendments'},{l:'Articles',s:'articles'},{l:'SCOTUS',s:'scotus'},{l:'Vocabulary',s:'vocab'},{l:'Docs',s:'docs'},{l:'Progress',s:'progress'}];

// ── APP ────────────────────────────────────────────────────────
const App=()=>{
  const savedScreen=localStorage.getItem('apgov_screen');
  const[screen,    setScreen]    =React.useState(savedScreen||TWEAK_DEFAULTS.screen||'dashboard');
  const[activeUnit,setActiveUnit]=React.useState(TWEAK_DEFAULTS.activeUnit||1);
  const[activeTopic,setActiveTopic]=React.useState('1.1 Ideals of Democracy');
  const[topicKey,  setTopicKey]  =React.useState(null);
  const[unitOverviewId,setUnitOverviewId]=React.useState(1);
  const[mobileSidebarOpen,setMobileSidebarOpen]=React.useState(false);
  const[progress,  setProgress]  =React.useState(()=>{ try{return JSON.parse(localStorage.getItem('apgov_progress')||'{}')}catch{return{}} });
  const[darkMode,  setDarkMode]  =React.useState(()=>{ try{return localStorage.getItem('apgov_dark')==='true'}catch{return false} });
  const[settings,  setSettings]  =React.useState(loadSettings);
  const[settingsOpen,setSettingsOpen]=React.useState(false);
  const[practiceTopic,setPracticeTopic]=React.useState(null); // for topic→practice routing
  const[sidebarCollapsed,setSidebarCollapsed]=React.useState(()=>{ try{return localStorage.getItem('apgov_sidebar_collapsed')==='true'}catch{return false} });
  const[stimulusModalId,setStimulusModalId]=React.useState(null); // for stimulus question modal
  React.useEffect(()=>{ localStorage.setItem('apgov_sidebar_collapsed',String(sidebarCollapsed)); },[sidebarCollapsed]);

  const navigate=(s,unitId)=>{ 
    if(s==='unit-overview') { 
      setUnitOverviewId(unitId); 
      setActiveUnit(unitId);
      setScreen('unit-overview'); 
      localStorage.setItem('apgov_screen','unit-overview'); 
    } else { 
      setScreen(s); 
      localStorage.setItem('apgov_screen',s); 
    } 
  };

  React.useEffect(()=>{ document.body.classList.toggle('dark',darkMode); localStorage.setItem('apgov_dark',String(darkMode)); },[darkMode]);
  React.useEffect(()=>{ localStorage.setItem('apgov_progress',JSON.stringify(progress)); },[progress]);
  React.useEffect(()=>{
    const themes=['theme-charcoal','theme-midnight','theme-warm'];
    themes.forEach(t=>document.body.classList.remove(t));
    const ct=settings.colorTheme;
    if(ct&&ct!=='classic') document.body.classList.add('theme-'+ct);
  },[settings.colorTheme]);

  const updateSetting=(key,val)=>{ const s={...settings,[key]:val}; setSettings(s); saveSettings(s); };

  React.useEffect(()=>{
    const handler=e=>{ if(e.data?.type==='__activate_edit_mode') document.getElementById('tweak-panel').classList.add('visible'); if(e.data?.type==='__deactivate_edit_mode') document.getElementById('tweak-panel').classList.remove('visible'); };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    const se=document.getElementById('tweak-screen'),ue=document.getElementById('tweak-unit');
    if(se){se.value=screen;se.addEventListener('change',e=>{navigate(e.target.value);window.parent.postMessage({type:'__edit_mode_set_keys',edits:{screen:e.target.value}},'*');});}
    if(ue){ue.value=String(activeUnit);ue.addEventListener('change',e=>{setActiveUnit(parseInt(e.target.value));window.parent.postMessage({type:'__edit_mode_set_keys',edits:{activeUnit:parseInt(e.target.value)}},'*');});}
    return()=>window.removeEventListener('message',handler);
  },[]);

  const d=darkMode;
  const tabBg=d?'#111B2B':'#fff';
  const tabBord=d?'#1E2D42':'#EEF0F4';

  const progressDone=Object.fromEntries(ALL_QUESTIONS.filter(q=>progress.answers?.[q.id]?.correct).map(q=>[`${q.unit} · Topic ${q.topic}`,true]));
  const totalQAnswered=Object.keys(progress.answers||{}).length;
  const sidebarPct=Math.min(Math.round((totalQAnswered/ALL_QUESTIONS.length)*100),100);

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
      {/* HEADER */}
      <header style={{background:'var(--theme-header)',height:54,display:'flex',alignItems:'center',padding:'0 20px',gap:12,flexShrink:0,boxShadow:'0 1px 0 rgba(255,255,255,0.06)',zIndex:100}}>
        {/* Mobile hamburger */}
        <button className="mobile-menu-btn" onClick={()=>setMobileSidebarOpen(o=>!o)} style={{display:'none',background:'rgba(255,255,255,0.1)',border:'1px solid rgba(255,255,255,0.15)',borderRadius:7,padding:'6px 8px',cursor:'pointer',color:'#fff',flexShrink:0}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div style={{display:'flex',alignItems:'center',gap:10,minWidth:160,flexShrink:0}}>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect width="22" height="22" rx="5" fill="#B22234"/><text x="11" y="16" textAnchor="middle" fill="white" fontSize="13" fontWeight="700" fontFamily="serif">AP</text></svg>
          <div><div style={{color:'#fff',fontWeight:700,fontSize:15,fontFamily:"'Source Sans 3',Arial,sans-serif",lineHeight:1.2}}>AP Gov Practice</div><div style={{color:'#748092',fontSize:10,fontFamily:"'Source Sans 3',Arial,sans-serif"}}>U.S. Government &amp; Politics</div></div>
        </div>
        <GlobalSearch dark={d} onNavigate={navigate} onTopicSelect={(topic,unitId)=>{setActiveTopic(topic);setActiveUnit(unitId);setTopicKey(topic);navigate('topic');}}/>
        <div className="header-right-btns" style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
          <button onClick={()=>setDarkMode(d=>!d)} style={{display:'flex',alignItems:'center',gap:6,background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.15)',borderRadius:20,padding:'5px 12px',cursor:'pointer',color:'#fff',fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,fontWeight:600}}>
            <span style={{fontSize:14}}>{d?'☀':'🌙'}</span><span className="btn-label">{d?'Light':'Dark'}</span>
          </button>
          <button onClick={()=>setSettingsOpen(true)} style={{display:'flex',alignItems:'center',gap:6,background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.15)',borderRadius:20,padding:'5px 12px',cursor:'pointer',color:'#fff',fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12,fontWeight:600}}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
            <span className="btn-label">Settings</span>
          </button>
          <div style={{fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:10,fontWeight:700,letterSpacing:'0.06em',textTransform:'uppercase',background:'rgba(201,168,76,0.15)',border:'1px solid rgba(201,168,76,0.35)',color:'#C9A84C',padding:'4px 10px',borderRadius:9999}}>AMSCO</div>
        </div>
      </header>

      <div style={{display:'flex',flex:1,overflow:'hidden',position:'relative'}}>
        {/* Mobile overlay */}
        <div className={`mobile-overlay${mobileSidebarOpen?' active':''}`} onClick={()=>setMobileSidebarOpen(false)}/>
        {/* SIDEBAR */}
        <Sidebar
          activeUnit={activeUnit} activeTopic={activeTopic} progress={progressDone}
          onTopicSelect={(topic,unitId)=>{
            setActiveTopic(topic); setActiveUnit(unitId);
            setTopicKey(topic); navigate('topic');
            setMobileSidebarOpen(false);
          }}
          onToolSelect={(s,unitId)=>{ navigate(s,unitId); setMobileSidebarOpen(false); }}
          questionsAnswered={totalQAnswered}
          totalQuestions={ALL_QUESTIONS.length}
          sidebarPct={sidebarPct}
          onProgressClick={()=>{ navigate('progress'); setMobileSidebarOpen(false); }}
          collapsed={sidebarCollapsed}
          onToggleCollapse={()=>setSidebarCollapsed(c=>!c)}
          mobileOpen={mobileSidebarOpen}
        />

        <main className="app-main" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:d?'#0D1421':'#F8F9FB'}}>
          {/* Tab bar */}
          <div className="tab-bar" style={{background:tabBg,borderBottom:`1px solid ${tabBord}`,padding:'0 12px',display:'flex',overflowX:'auto',flexShrink:0}}>
            {TABS.map(tab=>{
              const active=screen===tab.s;
              return(
                <button key={tab.s} onClick={()=>{if(tab.s==='unit-overview') { setUnitOverviewId(activeUnit); } navigate(tab.s);}} className={`tab-btn${active?' active':''}`}
                  style={{fontFamily:"'Source Sans 3',Arial,sans-serif",fontSize:12.5,fontWeight:600,padding:'13px 11px',border:'none',background:'transparent',cursor:'pointer',
                    color:active?(d?'var(--theme-accent-light)':'var(--theme-accent)'):(d?'#5A6779':'#9BA5B2'),
                    borderBottom:active?(d?'2.5px solid var(--theme-accent-light)':'2.5px solid var(--theme-accent)'):'2.5px solid transparent',
                    transition:'all 150ms',whiteSpace:'nowrap',marginBottom:-1}}>
                  {tab.l}
                </button>
              );
            })}
          </div>

          <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
            {screen==='unit-overview'&&<UnitOverview unitId={unitOverviewId} onNavigatePractice={t=>{setPracticeTopic(`Unit ${unitOverviewId}`);navigate('practice');}} onNavigateTopic={(topic,unitId)=>{setActiveTopic(topic);setActiveUnit(unitId);setTopicKey(topic);navigate('topic');}} dark={d}/>}
            {screen==='topic'      &&<TopicStudyScreen topicKey={topicKey} onBack={()=>navigate('dashboard')} onNavigatePractice={t=>{setPracticeTopic(t);navigate('practice');}} dark={d}/>}
            {screen==='dashboard'  &&<DashboardScreen activeUnit={activeUnit} onNavigate={navigate} progress={progress} dark={d}/>}
            {screen==='practice'   &&<PracticeScreen progress={progress} setProgress={setProgress} dark={d} initialTopic={practiceTopic} onOpenStimulusModal={setStimulusModalId}/>}
            {screen==='amendments' &&<AmendmentsScreen dark={d}/>}
            {screen==='articles'   &&<ArticlesScreen dark={d}/>}
            {screen==='scotus'     &&<ScotusScreen dark={d}/>}
            {screen==='vocab'      &&<VocabScreen dark={d} setProgress={setProgress}/>}
            {screen==='docs'       &&<DocsScreen dark={d}/>}
            {screen==='progress'   &&<ProgressScreen progress={progress} dark={d} onNavigate={navigate}/>}
          </div>
        </main>
      </div>

      <SettingsDrawer open={settingsOpen} onClose={()=>setSettingsOpen(false)} settings={settings} onSettingChange={updateSetting} dark={d}/>
      {stimulusModalId && <StimulusModal stimulusId={stimulusModalId} onClose={()=>setStimulusModalId(null)} dark={d} />}
    </div>
  );
};

// Wait for all components to load, then render
const waitForComponents = () => {
  const requiredComponents = ['Sidebar', 'Header', 'GlobalSearch'];
  const allLoaded = requiredComponents.every(c => typeof window[c] !== 'undefined');
  
  if (allLoaded) {
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  } else {
    setTimeout(waitForComponents, 100);
  }
};

// Start the app after a brief delay to ensure all scripts are parsed
setTimeout(waitForComponents, 500);
</script>

          src={stimulus.file}
          style={{
            width: '100%', height: 'calc(90vh - 56px)', border: 'none',
            background: dark ? '#0D1621' : '#F5F4F0'
          }}
          title={`Stimulus ${stimulusId}`}
        />
      </div>
    </div>
  );
};
</script>
</body>
</html>
