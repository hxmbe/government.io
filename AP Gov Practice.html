  // Topic 3.7 — Selective Incorporation
  {id:100,unit:"Unit 3",topic:"3.7",type:"SCOTUS",difficulty:"Medium",
   stem:"Gitlow v. New York (1925) is historically significant primarily because it:",
   choices:["Struck down all state-level sedition laws.","Began the process of selective incorporation by applying the Free Speech Clause to the states.","Established the 'clear and present danger' test.","Overturned Schenck v. United States."],
   correct:1,hint:"Gitlow was the FIRST time the Court applied a Bill of Rights protection to a state.",
   wrongNotes:["Gitlow actually upheld his conviction under New York's criminal anarchy law.","CORRECT — Gitlow began incorporation, applying free speech protections to states via the 14th Amendment.","The 'clear and present danger' test came from Schenck (1919), not Gitlow.","Gitlow did not overturn Schenck; it extended free speech protection to state action."],
   explanation:"Gitlow v. New York (1925) began selective incorporation: the 14th Amendment's Due Process Clause extends certain Bill of Rights protections — here, free speech — to state governments.",scotus:{name:"Gitlow v. New York",year:"1925"}},
  {id:101,unit:"Unit 3",topic:"3.7",type:"Concept Application",difficulty:"Medium",
   stem:"Selective incorporation relies on which specific constitutional provision to apply the Bill of Rights to the states?",
   choices:["The Supremacy Clause of Article VI","The Privileges and Immunities Clause of Article IV","The Due Process Clause of the Fourteenth Amendment","The Necessary and Proper Clause of Article I"],
   correct:2,hint:"Which amendment imposes limits on STATE governments that mirror federal due process?",
   wrongNotes:["The Supremacy Clause addresses federal law supremacy, not rights incorporation.","Art. IV P&I Clause addresses interstate citizen treatment, not Bill of Rights incorporation.","CORRECT — the 14th Amendment's Due Process Clause is the vehicle for selective incorporation.","N&P Clause expands congressional powers, not individual rights."],
   explanation:"Selective incorporation works through the 14th Amendment's Due Process Clause: the Court has held that 'fundamental' Bill of Rights protections are binding on states as a matter of due process."},
  {id:102,unit:"Unit 3",topic:"3.7",type:"SCOTUS Comparison",difficulty:"Hard",
   stem:"McDonald v. Chicago (2010) applied selective incorporation in a way that parallels which earlier landmark case?",
   choices:["Marbury v. Madison (1803), which established judicial review.","Gitlow v. New York (1925), which first incorporated a Bill of Rights protection against the states.","Baker v. Carr (1962), which opened apportionment to judicial review.","United States v. Lopez (1995), which limited the Commerce Clause."],
   correct:1,hint:"Both cases made a Bill of Rights protection enforceable against STATE (not just federal) governments.",
   wrongNotes:["Marbury addressed judicial review, not incorporation.","CORRECT — McDonald incorporated the 2nd Amendment just as Gitlow incorporated the 1st.","Baker addressed justiciability, not incorporation.","Lopez limited federal power, unrelated to incorporation."],
   explanation:"McDonald (2010) extended the 2nd Amendment's individual right (from D.C. v. Heller) to state and local governments through the 14th Amendment — the same mechanism Gitlow used for free speech.",
   comparedCase:{name:"McDonald v. Chicago (2010)",note:"Incorporated the 2nd Amendment against states, mirroring the pattern begun by Gitlow (1925) for the 1st Amendment."}},

  // Topic 3.10 — Social Movements & Civil Rights
  {id:103,unit:"Unit 3",topic:"3.10",type:"Concept Application",difficulty:"Easy",
   stem:"The Civil Rights Act of 1964 is BEST understood as:",
   choices:["A constitutional amendment banning segregation.","A federal statute prohibiting discrimination in public accommodations, employment, and federally funded programs.","A Supreme Court decision overturning Plessy v. Ferguson.","An executive order integrating the armed forces."],
   correct:1,hint:"Is it an amendment, a court ruling, an executive order, or a statute passed by Congress?",
   wrongNotes:["The CRA is a federal statute, not a constitutional amendment.","CORRECT — Title II bans public-accommodations discrimination; Title VII bans employment discrimination.","Brown (1954) — not the CRA — overturned Plessy's 'separate but equal' doctrine.","Truman's Executive Order 9981 (1948) integrated the military."],
   explanation:"The Civil Rights Act of 1964 is a federal statute. Title II bans discrimination in public accommodations; Title VII bans employment discrimination — upheld under the Commerce Clause in Heart of Atlanta Motel v. U.S."},
  {id:104,unit:"Unit 3",topic:"3.10",type:"SCOTUS Comparison",difficulty:"Hard",
   stem:"Brown v. Board of Education (1954) and Plessy v. Ferguson (1896) reach opposite conclusions on school segregation. What is the fundamental difference in reasoning?",
   choices:["Plessy relied on the Commerce Clause; Brown relied on the Equal Protection Clause.","Plessy upheld 'separate but equal'; Brown held that separate educational facilities are inherently unequal.","Both reached the same conclusion; Brown simply enforced Plessy more strictly.","Brown applied only to public colleges, while Plessy applied to all schools."],
   correct:1,hint:"Both cases interpret the 14th Amendment's Equal Protection Clause — but disagree on what 'equal' means in practice.",
   wrongNotes:["Both cases interpreted the 14th Amendment's Equal Protection Clause.","CORRECT — Brown rejected Plessy's separate-but-equal doctrine, finding inherent inequality in segregation.","They reached opposite conclusions on the constitutionality of segregation.","Brown addressed primary and secondary public schools generally."],
   explanation:"Plessy (1896) allowed 'separate but equal' facilities. Brown (1954) unanimously held that segregated public schools are inherently unequal, violating the Equal Protection Clause.",
   comparedCase:{name:"Plessy v. Ferguson (1896)",note:"Established 'separate but equal.' Brown (1954) overruled it on 14th Amendment Equal Protection grounds."}},
  {id:105,unit:"Unit 3",topic:"3.10",type:"Stimulus-Based",difficulty:"Medium",
   stimulus:{type:"excerpt",source:"Letter from Birmingham Jail (Dr. Martin Luther King Jr., 1963)",text:"Nonviolent direct action seeks to create such a crisis and foster such a tension that a community which has constantly refused to negotiate is forced to confront the issue. It seeks so to dramatize the issue that it can no longer be ignored."},
   stem:"Based on the passage, King argues that nonviolent direct action is effective because it:",
   choices:["Physically overpowers opponents of civil rights.","Creates productive tension that forces negotiation of injustice.","Relies on federal courts to enforce court orders.","Uses electoral pressure to change laws."],
   correct:1,hint:"King explicitly names 'crisis' and 'tension' as the tools of nonviolent protest.",
   wrongNotes:["King's entire approach rejects physical force.","CORRECT — King argues tension is the mechanism that forces confrontation.","Courts are a separate channel, not the focus of this passage.","King's strategy was protest, not primarily electoral."],
   explanation:"King argues that nonviolent direct action creates visible tension that a community 'can no longer ignore,' forcing negotiation on civil rights."},

  // Topic 3.11 — Government Responses
  {id:106,unit:"Unit 3",topic:"3.11",type:"Concept Application",difficulty:"Medium",
   stem:"The Voting Rights Act of 1965 and the 24th Amendment (1964) together addressed which shared goal?",
   choices:["Lowering the voting age to 18.","Removing discriminatory barriers to voting.","Establishing federal voter ID requirements.","Creating a national voter registration database."],
   correct:1,hint:"Think about who these laws were designed to ENFRANCHISE.",
   wrongNotes:["The 26th Amendment (1971) addressed the voting age.","CORRECT — the 24th Amendment banned poll taxes; the VRA banned literacy tests and discriminatory practices.","No federal voter ID mandate was created.","No national registration database was created by these laws."],
   explanation:"The 24th Amendment abolished poll taxes in federal elections (1964); the VRA (1965) banned literacy tests and created federal preclearance for jurisdictions with histories of discrimination."},
  {id:107,unit:"Unit 3",topic:"3.11",type:"SCOTUS",difficulty:"Hard",
   stem:"Shelby County v. Holder (2013) weakened which major civil rights statute?",
   choices:["The Civil Rights Act of 1964","The Voting Rights Act of 1965","The Fair Housing Act of 1968","The Americans with Disabilities Act of 1990"],
   correct:1,hint:"The case involved the 'preclearance' formula identifying jurisdictions subject to federal oversight of voting rule changes.",
   wrongNotes:["Shelby did not address the CRA.","CORRECT — Shelby struck down the VRA's coverage formula (Section 4(b)), effectively disabling Section 5 preclearance.","Shelby was not a housing case.","Shelby did not address the ADA."],
   explanation:"Shelby County v. Holder (2013) struck down the VRA's coverage formula as outdated, ending the practice of federal preclearance for jurisdictions with histories of voting discrimination.",scotus:{name:"Shelby County v. Holder",year:"2013"}},
  {id:108,unit:"Unit 3",topic:"3.11",type:"Quantitative Analysis",difficulty:"Medium",
   stem:"In Mississippi, Black voter registration rose from roughly 7% before 1965 to over 60% by 1968. Which policy change BEST explains this shift?",
   choices:["Expansion of early voting and mail ballots.","Passage and enforcement of the Voting Rights Act of 1965.","Adoption of a national voter ID law.","Introduction of the 26th Amendment."],
   correct:1,hint:"Which law specifically targeted the tactics Mississippi had used to suppress Black registration?",
   wrongNotes:["Early/mail voting expansion came much later.","CORRECT — the VRA (1965) banned literacy tests and sent federal examiners to register voters.","No national voter ID law exists; strict state ID laws came decades later.","The 26th Amendment (1971) lowered the voting age, unrelated to race-based suppression."],
   explanation:"The Voting Rights Act of 1965 banned literacy tests and authorized federal examiners in discriminatory jurisdictions — driving dramatic increases in Black voter registration across the South."},

  // Topic 3.12 — Minority & Majority Rights
  {id:109,unit:"Unit 3",topic:"3.12",type:"Concept Application",difficulty:"Medium",
   stem:"A central challenge in American democracy, especially highlighted in Federalist No. 10 and in civil rights history, is:",
   choices:["Preventing the federal government from regulating commerce at all.","Balancing majority rule with protection of minority rights.","Maximizing state power over individual rights.","Ensuring the president can act without congressional approval."],
   correct:1,hint:"What tension did Madison discuss as 'majority faction,' and what do the Reconstruction Amendments protect against?",
   wrongNotes:["This is not the challenge — commerce regulation is a constitutional power.","CORRECT — majority rule vs. minority rights is the core tension Madison and civil rights movements address.","The Constitution limits state power via the 14th Amendment.","Presidential power is constrained by separation of powers, not expanded."],
   explanation:"The tension between majority rule and minority rights is central to American democracy — from Madison's faction concerns in Federalist No. 10 to modern civil rights law."},
  {id:110,unit:"Unit 3",topic:"3.12",type:"SCOTUS",difficulty:"Medium",
   stem:"In Obergefell v. Hodges (2015), the Supreme Court held that:",
   choices:["States may define marriage however they choose.","The right to marry is guaranteed to same-sex couples under the 14th Amendment's Due Process and Equal Protection Clauses.","Congress has exclusive authority over marriage laws.","Marriage is protected under the Free Exercise Clause."],
   correct:1,hint:"Which amendment was the constitutional basis for the decision?",
   wrongNotes:["The ruling REQUIRED states to recognize same-sex marriage.","CORRECT — Obergefell grounded the right in Due Process and Equal Protection.","Marriage is historically state-regulated, not congressionally defined.","The Free Exercise Clause is about religion, not marriage."],
   explanation:"Obergefell v. Hodges (2015) ruled that the 14th Amendment guarantees the right to marry to same-sex couples under both the Due Process and Equal Protection Clauses."},
  {id:111,unit:"Unit 3",topic:"3.12",type:"Concept Application",difficulty:"Medium",
   stem:"The Equal Protection Clause of the 14th Amendment applies 'strict scrutiny' to laws that:",
   choices:["Regulate economic activity.","Classify people based on race or national origin, or burden fundamental rights.","Impose taxes on interstate commerce.","Create administrative agencies."],
   correct:1,hint:"Which classifications trigger the most skeptical level of judicial review?",
   wrongNotes:["Economic regulations get rational-basis review, the lowest standard.","CORRECT — race, national origin, and fundamental rights trigger strict scrutiny.","Commerce taxation has its own Commerce Clause analysis.","Agency creation is not itself an equal protection issue."],
   explanation:"Strict scrutiny applies to laws classifying by race or national origin, or burdening fundamental rights. The government must show a compelling interest and narrowly tailored means."},

  // Topic 3.13 — Affirmative Action
  {id:112,unit:"Unit 3",topic:"3.13",type:"SCOTUS",difficulty:"Hard",
   stem:"Students for Fair Admissions v. Harvard (2023) held that:",
   choices:["Affirmative action in college admissions is constitutionally required.","Race-conscious college admissions programs violate the Equal Protection Clause.","Only public universities may consider race in admissions.","Race-based admissions are permitted only for graduate programs."],
   correct:1,hint:"Did the Court uphold or strike down race-conscious admissions at Harvard and UNC?",
   wrongNotes:["The Court struck down the programs as unconstitutional.","CORRECT — the Court ruled race-conscious admissions violate the Equal Protection Clause.","Harvard is private, but the Court applied Title VI (tied to federal funding) and the 14th Amendment to UNC.","The ruling applies to undergraduate and graduate admissions alike."],
   explanation:"In SFFA v. Harvard (2023), the Court ruled that race-conscious admissions programs at Harvard and UNC violated the Equal Protection Clause (and Title VI), ending affirmative action in college admissions.",scotus:{name:"Students for Fair Admissions v. Harvard",year:"2023"}},
  {id:113,unit:"Unit 3",topic:"3.13",type:"Concept Application",difficulty:"Medium",
   stem:"Supporters of affirmative action typically argue that it:",
   choices:["Violates the Equal Protection Clause.","Addresses historical and ongoing inequalities by expanding opportunity for underrepresented groups.","Is required by the 26th Amendment.","Eliminates all consideration of merit in admissions or hiring."],
   correct:1,hint:"What is the primary justification offered BY supporters — not opponents?",
   wrongNotes:["Opponents — not supporters — argue this.","CORRECT — supporters frame it as remedying historic inequality and promoting diversity.","The 26th Amendment concerns voting age, not affirmative action.","Most affirmative action policies consider multiple factors, including merit."],
   explanation:"Supporters argue affirmative action addresses historical inequalities and promotes diversity. Opponents argue it violates equal protection by treating individuals differently based on race."},
  {id:114,unit:"Unit 3",topic:"3.13",type:"Comparison",difficulty:"Hard",
   stem:"Regents of the University of California v. Bakke (1978) and Students for Fair Admissions v. Harvard (2023) differ MOST in their conclusions about:",
   choices:["Whether race can be considered as one factor among many in college admissions.","Whether quotas based on race are permitted.","The constitutionality of vouchers for private colleges.","Whether public universities are subject to the 14th Amendment."],
   correct:0,hint:"Bakke allowed race as ONE factor; SFFA rejected even that limited use.",
   wrongNotes:["CORRECT — Bakke allowed race as a plus factor; SFFA effectively ended that practice.","Both decisions agreed quotas are unconstitutional.","Neither case addresses private-college vouchers.","Both cases affirm that public universities are subject to the 14th Amendment."],
   explanation:"Bakke (1978) banned strict racial quotas but allowed race to be one factor among many. SFFA (2023) reversed that narrower allowance, ruling race-conscious admissions unconstitutional."},

  // Topic 4.1 — American Attitudes About Government
  {id:115,unit:"Unit 4",topic:"4.1",type:"Concept Application",difficulty:"Easy",
   stem:"Which of the following is a core American political value that cuts across most ideological lines?",
   choices:["Central economic planning","Individualism and limited government","Mandatory military service","Aristocratic rule"],
   correct:1,hint:"Which value appears in the Declaration, Bill of Rights, and is frequently invoked by both parties?",
   wrongNotes:["Central planning contradicts American political culture.","CORRECT — individualism and limited government are widely shared, though parties interpret them differently.","The U.S. has a volunteer military; conscription is politically contentious.","Aristocracy is explicitly rejected (no titles of nobility clause, Art. I §9)."],
   explanation:"Individualism, limited government, equality of opportunity, free enterprise, and rule of law are core American values — shared widely, though parties emphasize different facets."},
  {id:116,unit:"Unit 4",topic:"4.1",type:"Quantitative Analysis",difficulty:"Medium",
   stem:"A recent poll finds 61% of Americans say government is 'doing too much,' while 37% say it should 'do more.' This result BEST illustrates:",
   choices:["Unanimity about the proper size of government.","A persistent American skepticism toward expansive government.","Overwhelming public support for a European-style welfare state.","That Americans prefer a single-party system."],
   correct:1,hint:"Which interpretation matches the stronger side of the poll's numbers?",
   wrongNotes:["61% vs. 37% is not unanimity.","CORRECT — a majority preferring less government reflects a persistent strand of American political culture.","These numbers are the OPPOSITE of overwhelming welfare-state support.","Polling on government size doesn't tell us anything about party-system preferences."],
   explanation:"Limited-government skepticism has long been a feature of American attitudes — captured here by a majority saying government 'does too much.'"},
  {id:117,unit:"Unit 4",topic:"4.1",type:"Concept Application",difficulty:"Medium",
   stem:"The American political value of 'equality of opportunity' is BEST distinguished from 'equality of outcome' by its focus on:",
   choices:["Guaranteeing identical economic results for all citizens.","Ensuring fair starting conditions rather than identical end results.","Requiring a flat income tax.","Mandating equal voter turnout among demographic groups."],
   correct:1,hint:"Is the value about starting line or finishing line?",
   wrongNotes:["That would be equality of outcome, not opportunity.","CORRECT — equality of opportunity focuses on fair chances, not identical endpoints.","Tax policy is downstream; the value itself is about opportunity.","Voter turnout isn't the definition of this value."],
   explanation:"Equality of opportunity means fair starting conditions (e.g., education, non-discrimination); equality of outcome would mean identical endpoints. Most Americans embrace the former, not the latter."},

  // Topic 4.3 — Changes in Ideology over Time
  {id:118,unit:"Unit 4",topic:"4.3",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"data",source:"Pew Research — Partisan Ideological Self-Placement (1994 vs. 2023)",text:"                    1994     2023\nConsistent Liberal:   7%       17%\nMostly Liberal:      14%       18%\nMixed:               41%       23%\nMostly Conservative: 23%       22%\nConsistent Conservative:10%    20%\n\n(Remaining respondents: no opinion or missing)"},
   stem:"Which trend is BEST supported by the data?",
   choices:["Americans have become more ideologically moderate over time.","The 'Mixed' middle has shrunk while both ideological ends have grown — a pattern of polarization.","There is no meaningful change in ideological distribution between 1994 and 2023.","Conservatives have disappeared from American politics."],
   correct:1,hint:"Look at 'Consistent Liberal' AND 'Consistent Conservative' together, then at 'Mixed.'",
   wrongNotes:["The 'Mixed' center has SHRUNK — the opposite of moderation.","CORRECT — both consistent-liberal (7→17%) and consistent-conservative (10→20%) grew as the 'Mixed' middle (41→23%) collapsed.","The changes are large and clearly directional.","Consistent conservatives actually DOUBLED from 10% to 20%."],
   explanation:"The data shows classic polarization: both ideological ends grew while the mixed middle shrank — a defining feature of the last 30 years of American politics."},
  {id:119,unit:"Unit 4",topic:"4.3",type:"Concept Application",difficulty:"Medium",
   stem:"The 'New Deal coalition' (1930s–1960s) brought which groups together under the Democratic Party?",
   choices:["Wealthy northeastern industrialists and southern Republicans.","Urban workers, ethnic minorities, Southern whites, and labor unions.","Rural Midwestern farmers and Wall Street bankers.","Libertarians and social conservatives."],
   correct:1,hint:"FDR's Democratic coalition combined labor, Southern whites, and urban ethnic voters.",
   wrongNotes:["These groups largely opposed the New Deal.","CORRECT — FDR's coalition fused urban labor, minorities, Southern whites, and unions.","This pairing did not define the New Deal coalition.","These groups were not allied during the New Deal era."],
   explanation:"The New Deal coalition united urban workers, ethnic minorities, Southern whites, and organized labor, dominating Democratic politics until the civil rights era began splintering it."},
  {id:120,unit:"Unit 4",topic:"4.3",type:"Concept Application",difficulty:"Medium",
   stem:"A 'realignment' in American politics refers to:",
   choices:["A brief surge in voter turnout during a midterm election.","A durable shift in the coalitions supporting each major party.","The process by which third parties replace major parties.","A new constitutional amendment altering election rules."],
   correct:1,hint:"Is realignment short-term or long-term? Party-level or individual-level?",
   wrongNotes:["Turnout fluctuation alone is not realignment.","CORRECT — realignment involves a durable reshaping of party coalitions.","Third parties rarely replace major parties in the U.S.","Realignments are typically driven by elections/issues, not amendments."],
   explanation:"A realignment is a durable shift in voter coalitions — e.g., the New Deal realignment (1932) or the Southern realignment following civil rights legislation."},

  // Topic 4.4 — Political Events and Ideology
  {id:121,unit:"Unit 4",topic:"4.4",type:"Concept Application",difficulty:"Medium",
   stem:"The Great Depression and the New Deal significantly shifted American views on the proper role of government by:",
   choices:["Reducing public expectations of federal economic intervention.","Establishing a broader expectation that the federal government should manage the economy and provide a social safety net.","Ending bipartisan cooperation on economic policy.","Eliminating states' roles in social policy."],
   correct:1,hint:"Did the New Deal expand or shrink public expectations of federal action?",
   wrongNotes:["The opposite — expectations expanded significantly.","CORRECT — the New Deal established Social Security, regulated banking, and reshaped expectations.","Bipartisanship varied but did not end in 1933.","States retained important roles even with expanded federal programs."],
   explanation:"The New Deal reshaped American political culture, establishing the expectation that the federal government would manage the economy during downturns and provide a safety net (Social Security, unemployment insurance)."},
  {id:122,unit:"Unit 4",topic:"4.4",type:"Concept Application",difficulty:"Medium",
   stem:"A generational cohort whose political views are shaped most strongly by formative events (like 9/11 or the 2008 financial crisis) illustrates:",
   choices:["The steady-state model of public opinion.","A 'period effect' in political socialization — shared events shaping a generation's outlook.","The irrelevance of political events to ideology.","The dominance of genetics in political attitudes."],
   correct:1,hint:"Is it lifecycle (age), generational, or period effects that best describe this?",
   wrongNotes:["No such 'steady state' thesis fits the facts.","CORRECT — period effects describe broad events that shape a cohort's political views.","Events clearly shape opinion — the whole concept of political socialization relies on this.","Genetics is not the framework used in AP Gov for socialization."],
   explanation:"Period effects refer to events (wars, recessions, movements) that shape the political outlook of a generation exposed to them during formative years."},
  {id:123,unit:"Unit 4",topic:"4.4",type:"Concept Application",difficulty:"Medium",
   stem:"Following the September 11, 2001 attacks, public trust in the federal government briefly rose sharply before returning to long-term declining trends. This illustrates:",
   choices:["A rally-around-the-flag effect combined with long-term institutional distrust.","Permanent increases in government trust after national security events.","The irrelevance of events to public opinion.","Constitutional changes mandated by the 9/11 Commission."],
   correct:0,hint:"What is the short-term bump called? And what is the long-term pattern?",
   wrongNotes:["CORRECT — rally effects are short-term spikes; long-term trust has been declining since the 1960s.","The spike is typically short-term, not permanent.","Events clearly shape public opinion.","No constitutional changes were mandated."],
   explanation:"Post-9/11 trust spiked (a rally-around-the-flag effect) but quickly returned to a decades-long decline that began in the 1960s."},

  // Topic 4.8 — Ideology and Policy Making
  {id:124,unit:"Unit 4",topic:"4.8",type:"Concept Application",difficulty:"Medium",
   stem:"A liberal approach to economic policy is MOST likely to support:",
   choices:["Deregulation of financial markets and lower taxes on capital gains.","Progressive taxation, social programs, and market regulation to address inequality.","A return to the gold standard and strict limits on federal spending.","Privatization of Social Security and Medicare."],
   correct:1,hint:"Liberals prioritize government action to address economic inequality.",
   wrongNotes:["These are generally conservative economic positions.","CORRECT — liberalism emphasizes government action for economic equity.","Gold-standard advocacy is generally libertarian/conservative.","Privatization of entitlements is a conservative/libertarian position."],
   explanation:"Liberal economic policy generally supports progressive taxation, regulation, and social programs to address inequality and market failures."},
  {id:125,unit:"Unit 4",topic:"4.8",type:"Concept Application",difficulty:"Medium",
   stem:"A conservative approach to SOCIAL policy is MOST likely to:",
   choices:["Favor expansive federal regulation of personal behavior.","Prioritize traditional values, strong family structures, and limited federal involvement in moral questions.","Oppose all laws regulating any private behavior.","Support a single national religion."],
   correct:1,hint:"Which option captures traditional social conservatism most accurately?",
   wrongNotes:["This overstates the position and conflates it with other views.","CORRECT — traditional values plus skepticism of federal social engineering.","That's closer to libertarianism.","This would violate the Establishment Clause."],
   explanation:"Social conservatism generally favors traditional family structures and is skeptical of federal mandates on moral/cultural issues, often preferring state-level variation."},
  {id:126,unit:"Unit 4",topic:"4.8",type:"Comparison",difficulty:"Hard",
   stem:"Which pairing BEST illustrates the difference between liberal and conservative views on environmental policy?",
   choices:["Liberals favor deregulation; conservatives favor aggressive federal mandates.","Liberals generally favor federal regulation to address climate change; conservatives often favor market-based solutions and reduced regulation.","Both groups favor identical policies.","Environmental policy does not divide on ideological lines."],
   correct:1,hint:"Which side typically supports federal climate regulations like emissions limits?",
   wrongNotes:["This is reversed.","CORRECT — liberals favor federal regulation; conservatives emphasize markets/states and oppose expansive federal mandates.","Positions differ significantly on this issue.","Environmental policy is among the most ideologically polarized areas."],
   explanation:"Liberals generally support federal environmental regulation (emissions standards, EPA authority); conservatives typically favor market incentives and oppose expansive federal mandates."},

  // Topic 4.10 — Social Policy
  {id:127,unit:"Unit 4",topic:"4.10",type:"Concept Application",difficulty:"Easy",
   stem:"Social Security is BEST classified as which type of federal program?",
   choices:["A discretionary defense program","An entitlement (mandatory) program","A block grant to states","A federal loan guarantee"],
   correct:1,hint:"Is Social Security funded through annual congressional appropriations or through formula-based mandatory spending?",
   wrongNotes:["Social Security is not defense-related.","CORRECT — Social Security is an entitlement (mandatory) program funded largely by payroll taxes.","Block grants go to states; Social Security is a federal benefit to individuals.","It is not a loan program."],
   explanation:"Social Security is a mandatory/entitlement program, meaning anyone meeting the eligibility rules receives benefits without needing annual congressional appropriation."},
  {id:128,unit:"Unit 4",topic:"4.10",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"data",source:"CBO Projections — Major Entitlement Spending as % of GDP",text:"Category              2020     2040 (proj.)\nSocial Security:       5.0%       6.3%\nMedicare:              3.4%       6.2%\nMedicaid/ACA:          2.5%       3.1%\n\nProjected federal revenue: ~18% of GDP (historical average)"},
   stem:"Which statement is BEST supported by the data?",
   choices:["Entitlement spending is projected to consume a larger share of federal resources over time.","Entitlement spending will shrink as a share of the economy.","Medicaid is the single largest program shown.","Federal revenue is projected to grow much faster than entitlements."],
   correct:0,hint:"Compare 2020 totals to 2040 projections across the three programs.",
   wrongNotes:["CORRECT — SS + Medicare + Medicaid rise from ~10.9% to ~15.6% of GDP.","The opposite: they are projected to grow substantially.","Medicare is larger in both periods.","Revenue is projected stable near historical average while entitlements grow."],
   explanation:"Major entitlements are projected to consume a growing share of GDP, creating long-term fiscal pressure when paired with roughly stable revenue projections."},
  {id:129,unit:"Unit 4",topic:"4.10",type:"Concept Application",difficulty:"Medium",
   stem:"The Patient Protection and Affordable Care Act (2010) primarily sought to:",
   choices:["Replace Medicare with a voucher system.","Expand health insurance coverage through individual mandates, exchanges, and Medicaid expansion.","Privatize Social Security.","Eliminate employer-sponsored insurance."],
   correct:1,hint:"What was the ACA's approach to increasing coverage?",
   wrongNotes:["The ACA did not touch Medicare's basic structure.","CORRECT — exchanges, mandates (since softened), and Medicaid expansion were the three pillars.","Social Security was not part of the ACA.","Employer-sponsored insurance was preserved."],
   explanation:"The ACA expanded coverage via (1) insurance exchanges, (2) an individual mandate (penalty later reduced to $0), and (3) Medicaid expansion, upheld as optional for states in NFIB v. Sebelius (2012)."},

  // Topic 5.4 — How Parties Change
  {id:130,unit:"Unit 5",topic:"5.4",type:"Concept Application",difficulty:"Medium",
   stem:"Which of the following is the BEST example of 'critical realignment'?",
   choices:["A single senator switching parties.","The 1932 shift of Black, urban, and labor voters to the Democratic Party under FDR.","A temporary dip in a party's approval rating.","A presidential candidate losing a primary."],
   correct:1,hint:"Realignment = durable, coalition-level shift tied to a major political moment.",
   wrongNotes:["Individual switches aren't realignments.","CORRECT — the 1932 New Deal realignment reshaped Democratic coalitions for decades.","Short-term approval shifts don't constitute realignments.","Primary losses are ordinary political events."],
   explanation:"Critical realignments are durable, coalition-level shifts tied to major events — e.g., FDR's 1932 election and the New Deal coalition."},
  {id:131,unit:"Unit 5",topic:"5.4",type:"Concept Application",difficulty:"Medium",
   stem:"The decline in voters identifying strongly with either major party and the rise of self-identified independents since the 1970s is called:",
   choices:["Realignment","Dealignment","Polarization","Gerrymandering"],
   correct:1,hint:"Are voters SHIFTING to a new party — or detaching from parties altogether?",
   wrongNotes:["Realignment is shifting to a party, not away from all parties.","CORRECT — dealignment describes declining party attachment and rising independents.","Polarization describes intra-party ideological consistency, not detachment.","Gerrymandering is a districting practice."],
   explanation:"Dealignment is the trend of voters detaching from major parties, often identifying as independents — a key feature of modern American politics."},
  {id:132,unit:"Unit 5",topic:"5.4",type:"Concept Application",difficulty:"Medium",
   stem:"Which factor has MOST contributed to the weakening of traditional party organizations since the mid-20th century?",
   choices:["The rise of direct primaries, candidate-centered campaigns, and independent media fundraising.","Constitutional amendments banning party activity.","A Supreme Court ruling dissolving parties.","A federal law requiring all candidates to run as independents."],
   correct:0,hint:"What structural changes reduced party bosses' control over nominations?",
   wrongNotes:["CORRECT — direct primaries, candidate-centered campaigns, and online fundraising erode party control.","No such constitutional amendments exist.","No Supreme Court ruling dissolves parties.","No such federal law exists."],
   explanation:"Direct primaries took nomination power from party bosses; candidate-centered campaigns and independent fundraising (including online) further weakened traditional party machinery."},

  // Topic 5.5 — Third Parties
  {id:133,unit:"Unit 5",topic:"5.5",type:"Concept Application",difficulty:"Easy",
   stem:"Despite rarely winning major elections, third parties in the U.S. often:",
   choices:["Prevent major parties from responding to new issues.","Introduce new ideas that major parties eventually absorb.","Control Congress for multi-decade periods.","Receive proportional representation in the House."],
   correct:1,hint:"What is the typical long-run political contribution of third parties?",
   wrongNotes:["They often FORCE major parties to adopt new issues.","CORRECT — third parties often introduce ideas (progressive income tax, abolition) later absorbed by major parties.","No third party has controlled Congress in the modern era.","The U.S. uses winner-take-all, not proportional representation."],
   explanation:"Third parties often introduce new issues (women's suffrage, direct election of senators) that major parties eventually adopt — their main long-run impact."},
  {id:134,unit:"Unit 5",topic:"5.5",type:"Quantitative Analysis",difficulty:"Medium",
   stem:"In a hypothetical plurality race, Candidate A (major) wins 48%, Candidate B (major) 46%, Candidate C (minor) 6%. In a subsequent campaign, C's voters overwhelmingly report they would have voted for B. This is BEST described as:",
   choices:["Evidence that the major parties are ideologically identical.","A 'spoiler effect' on third-party candidates under plurality rules.","A realignment.","Proof that the two-party system is proportional."],
   correct:1,hint:"What do we call the phenomenon where a third-party candidate draws votes that would have flipped the outcome?",
   wrongNotes:["The parties can differ substantially; the third party still draws lopsided preferences.","CORRECT — the classic 'spoiler effect' associated with Duverger's Law.","Realignment describes durable coalition shifts, not single-election outcomes.","The U.S. system is plurality, not proportional."],
   explanation:"The 'spoiler effect' — a third-party candidate drawing disproportionately from one major party — is a core mechanism by which plurality voting punishes third parties."},
  {id:135,unit:"Unit 5",topic:"5.5",type:"Comparison",difficulty:"Medium",
   stem:"The U.S. two-party system contrasts with multiparty systems in countries like Germany PRIMARILY because:",
   choices:["The U.S. uses proportional representation; Germany uses winner-take-all.","The U.S. uses winner-take-all/plurality elections; many European democracies use proportional representation.","Germany constitutionally prohibits more than two parties.","The U.S. Constitution names the two parties."],
   correct:1,hint:"Which electoral rule system does each country use?",
   wrongNotes:["Reversed — the U.S. is plurality; Germany uses mixed-member proportional.","CORRECT — electoral rules drive the party-system difference.","The opposite: Germany has many parties.","The U.S. Constitution does not mention parties."],
   explanation:"Proportional representation (Germany and others) rewards smaller parties with legislative seats proportional to vote share. U.S. winner-take-all elections discourage third parties (Duverger's Law)."},

  // Topic 5.7 — Interest Groups Influencing Policy
  {id:136,unit:"Unit 5",topic:"5.7",type:"Concept Application",difficulty:"Medium",
   stem:"An interest group files an amicus curiae brief in a Supreme Court case. This is an example of:",
   choices:["Lobbying Congress directly.","Litigating and advocating through the judicial branch.","Running independent television ads.","Organizing a grassroots rally."],
   correct:1,hint:"Which branch is the amicus brief directed at?",
   wrongNotes:["Amicus briefs go to courts, not Congress.","CORRECT — amicus briefs are a way interest groups influence the judicial branch.","Ads are media strategy, not amicus briefs.","Rallies are grassroots organizing, not amicus filings."],
   explanation:"Amicus curiae ('friend of the court') briefs let interest groups influence judicial decisions by providing arguments and information relevant to a case."},
  {id:137,unit:"Unit 5",topic:"5.7",type:"Concept Application",difficulty:"Medium",
   stem:"A small, concentrated interest group often outperforms larger, diffuse interest groups in influencing policy because:",
   choices:["Diffuse groups always have more resources.","Concentrated groups have stronger per-member stakes and lower coordination costs.","Diffuse groups are banned from lobbying.","Small groups receive automatic federal subsidies."],
   correct:1,hint:"Why are narrow, intense interests more politically effective than broad, weak ones?",
   wrongNotes:["Diffuse groups often have more total resources but less per-member intensity.","CORRECT — intense, concentrated stakes overcome free-rider problems that plague diffuse groups.","Both types can lobby.","No such subsidy exists."],
   explanation:"Concentrated groups (e.g., a specific industry) have higher per-member stakes and coordinate easily, while diffuse groups (consumers, taxpayers) suffer from free-rider problems despite their larger size."},
  {id:138,unit:"Unit 5",topic:"5.7",type:"Concept Application",difficulty:"Hard",
   stem:"Which of the following is the BEST example of an iron triangle at work?",
   choices:["A president firing a cabinet secretary.","Ongoing coordination among an agriculture subcommittee, the USDA, and a farm-industry lobby to shape crop subsidies.","A federal judge issuing an injunction.","A citizen writing to a member of Congress."],
   correct:1,hint:"Iron triangle = committee + agency + interest group.",
   wrongNotes:["This is executive action, not an iron triangle.","CORRECT — a committee + agency + interest group cooperating on policy is the classic iron triangle.","Judicial action is not an iron triangle.","Individual citizen action is not an iron triangle."],
   explanation:"Iron triangles are three-way policy relationships among congressional committees/subcommittees, federal agencies, and interest groups — each benefiting from stable cooperation."},

  // Topic 5.8 — Electing the President
  {id:139,unit:"Unit 5",topic:"5.8",type:"Concept Application",difficulty:"Easy",
   stem:"A candidate becomes President of the United States by winning:",
   choices:["A majority of the national popular vote.","A majority of Electoral College votes (270+).","A two-thirds vote in the Senate.","A plurality in at least 40 states."],
   correct:1,hint:"What is the threshold set by Article II and the 12th Amendment?",
   wrongNotes:["The popular vote does not determine the presidency.","CORRECT — 270 of 538 electoral votes is required.","A Senate vote only applies if the Electoral College deadlocks and the House can't decide (very rare).","No such 40-state threshold exists."],
   explanation:"Presidents are elected by winning a majority of Electoral College votes (270 of 538). This explains why candidates focus on swing states, not the national popular vote."},
  {id:140,unit:"Unit 5",topic:"5.8",type:"Concept Application",difficulty:"Medium",
   stem:"The 'winner-take-all' system used by 48 states for allocating electoral votes results in:",
   choices:["Candidates spending equal time in every state.","Candidates concentrating campaign resources in a small number of competitive 'swing' states.","Candidates focusing exclusively on California and Texas.","Proportional allocation of electoral votes to candidates based on the statewide popular vote."],
   correct:1,hint:"Why do campaigns ignore deep-red Idaho and deep-blue Vermont but flood Pennsylvania?",
   wrongNotes:["Candidates concentrate on swing states, not every state equally.","CORRECT — WTA at the state level makes non-competitive states unimportant to campaigns.","CA and TX are large but not competitive at the statewide level in recent cycles.","Only Maine and Nebraska use partial proportional/district allocation."],
   explanation:"Under state-level winner-take-all, non-competitive states are strategically irrelevant. Campaigns concentrate on swing states where a small vote shift can flip all the electoral votes."},
  {id:141,unit:"Unit 5",topic:"5.8",type:"Concept Application",difficulty:"Medium",
   stem:"Incumbent presidents running for reelection typically enjoy which advantage?",
   choices:["Guaranteed automatic renomination without any primary.","Name recognition, fundraising networks, and the 'bully pulpit.'","Freedom from Federal Election Commission rules.","Exemption from debates."],
   correct:1,hint:"What resources does the presidency itself confer on the incumbent?",
   wrongNotes:["Incumbents usually face primaries, though they typically win easily.","CORRECT — incumbency brings recognition, money, and the platform of the office.","All federal candidates face FEC rules.","Debates remain the norm even for incumbents, though not strictly required."],
   explanation:"Incumbent presidents benefit from high name recognition, established fundraising, and the ability to use the office's visibility (the 'bully pulpit') to drive the agenda."},

  // Topic 5.9 — Congressional Elections
  {id:142,unit:"Unit 5",topic:"5.9",type:"Concept Application",difficulty:"Easy",
   stem:"The 'incumbency advantage' in Congress refers to the empirical observation that:",
   choices:["Incumbents almost always face serious primary challenges.","Incumbent members of Congress are reelected at very high rates.","The Constitution guarantees incumbents renomination.","Challengers typically outspend incumbents."],
   correct:1,hint:"Reelection rates in the U.S. House typically exceed 90%.",
   wrongNotes:["Serious primary challenges remain relatively rare.","CORRECT — House incumbents are reelected at roughly 90% or higher in most cycles.","No constitutional guarantee exists.","Incumbents typically outraise AND outspend challengers."],
   explanation:"Incumbency advantage: House incumbents are reelected at very high rates due to name recognition, franking, casework, fundraising advantages, and (often) favorable district lines."},
  {id:143,unit:"Unit 5",topic:"5.9",type:"Concept Application",difficulty:"Medium",
   stem:"Partisan gerrymandering refers to:",
   choices:["The constitutional process of apportioning House seats after the census.","Drawing district lines to maximize one party's advantage, often through 'packing' and 'cracking' voters.","Creating districts of equal population.","The Senate's 60-vote rule for ending debate."],
   correct:1,hint:"What are 'packing' and 'cracking'?",
   wrongNotes:["Apportionment is the seat allocation across states after the census — distinct from district drawing.","CORRECT — partisan gerrymandering uses packing (concentrating opposition voters) and cracking (splitting them) to secure seats.","Equal-population districting is 'one person, one vote' (Reynolds v. Sims).","That is the Senate cloture rule, unrelated."],
   explanation:"Partisan gerrymandering manipulates district lines to favor one party. In Rucho v. Common Cause (2019), the Court held that partisan gerrymandering claims are non-justiciable political questions in federal court."},
  {id:144,unit:"Unit 5",topic:"5.9",type:"SCOTUS",difficulty:"Hard",
   stem:"Shaw v. Reno (1993) established that:",
   choices:["All racial considerations in districting are automatically permissible.","Districts drawn predominantly on the basis of race may violate the Equal Protection Clause.","Congress has no role in redistricting.","States may ignore the Voting Rights Act when drawing districts."],
   correct:1,hint:"What did the Court say about bizarrely shaped districts drawn predominantly by race?",
   wrongNotes:["Racial gerrymandering can violate equal protection.","CORRECT — districts drawn predominantly by race receive strict scrutiny.","Congress sets national districting rules (e.g., single-member districts).","States must comply with federal voting law."],
   explanation:"Shaw v. Reno ruled that districts drawn predominantly on racial lines trigger strict scrutiny under the Equal Protection Clause. Race may be a factor but cannot be the predominant factor without compelling justification.",scotus:{name:"Shaw v. Reno",year:"1993"}},

  // Topic 5.10 — Modern Campaigns
  {id:145,unit:"Unit 5",topic:"5.10",type:"Concept Application",difficulty:"Medium",
   stem:"Modern presidential campaigns rely heavily on micro-targeted digital advertising because it:",
   choices:["Is cheaper than traditional broadcasting in every case.","Allows campaigns to deliver tailored messages to narrowly defined voter segments.","Is automatically banned during federal elections.","Replaces the need for any candidate debates."],
   correct:1,hint:"What does 'micro-targeting' actually deliver to campaigns?",
   wrongNotes:["Costs vary; the key advantage is precision, not always price.","CORRECT — micro-targeting uses data to reach narrow audiences with tailored messages.","Campaign digital ads are regulated but not banned.","Debates remain standard features of major campaigns."],
   explanation:"Micro-targeting lets campaigns deliver tailored messages to narrowly defined voter segments based on consumer data, demographics, and online behavior — a defining feature of modern campaigning."},
  {id:146,unit:"Unit 5",topic:"5.10",type:"Concept Application",difficulty:"Medium",
   stem:"Which of the following is an example of a 'grassroots' campaign strategy?",
   choices:["A 30-second national TV ad during the Super Bowl.","Door-to-door canvassing and local volunteer phone banks.","A wealthy donor's independent Super PAC.","A paid newspaper endorsement."],
   correct:1,hint:"Grassroots = bottom-up, person-to-person, often volunteer-driven.",
   wrongNotes:["Mass TV advertising is a top-down mass communication strategy.","CORRECT — canvassing and phone banks are classic grassroots tactics.","Super PACs are top-down donor-driven, not grassroots.","Paid endorsements are not grassroots efforts."],
   explanation:"Grassroots strategies rely on bottom-up, person-to-person contact — canvassing, phone banks, community events — in contrast to top-down mass media or big-donor strategies."},
  {id:147,unit:"Unit 5",topic:"5.10",type:"Concept Application",difficulty:"Medium",
   stem:"The front-loading of presidential primaries — states moving their contests earlier in the calendar — has what MAIN effect?",
   choices:["It reduces the role of money in campaigns.","It rewards candidates who can raise significant money and build organization early.","It guarantees that the most qualified candidate wins.","It eliminates party conventions."],
   correct:1,hint:"What kind of candidate benefits from having to compete in many states quickly?",
   wrongNotes:["Front-loading generally increases fundraising demands, not reduces them.","CORRECT — earlier contests reward well-funded, organized candidates.","Nothing about front-loading guarantees 'qualification.'","Party conventions still exist and finalize nominations."],
   explanation:"Front-loading compresses primaries early in the calendar, rewarding candidates who can raise money and build organizations quickly, while disadvantaging late-starting challengers."},

  // Topic 5.13 — Media & Democratic Debate
  {id:148,unit:"Unit 5",topic:"5.13",type:"Concept Application",difficulty:"Medium",
   stem:"Media 'agenda-setting' refers to the media's ability to:",
   choices:["Determine what citizens think about specific policies.","Influence which issues citizens think ABOUT by choosing what to cover.","Replace elected officials as decision-makers.","Control election outcomes directly."],
   correct:1,hint:"Classic formulation: the media tells us 'what to think about,' not exactly 'what to think.'",
   wrongNotes:["That's closer to priming or framing than agenda-setting.","CORRECT — agenda-setting shapes which issues are salient for the public.","Media do not replace officials.","Media influence is real but not that direct."],
   explanation:"Agenda-setting: the media tell us what to think ABOUT (by choosing what to cover). Framing tells us HOW to think about it; priming raises the weight of certain issues in evaluating politicians."},
  {id:149,unit:"Unit 5",topic:"5.13",type:"Concept Application",difficulty:"Medium",
   stem:"The rise of partisan cable news and ideologically curated online feeds has contributed MOST to which phenomenon?",
   choices:["A decline in political polarization.","Ideological 'echo chambers' in which citizens are exposed primarily to information reinforcing existing views.","A ban on political advertising.","Mandatory public access TV."],
   correct:1,hint:"What happens when different audiences consume entirely different media diets?",
   wrongNotes:["Partisan media are associated with INCREASED polarization.","CORRECT — echo chambers and filter bubbles are widely discussed effects of siloed media consumption.","Political advertising remains legal.","No such mandate exists."],
   explanation:"Partisan cable and algorithmic feeds can create 'echo chambers' in which citizens encounter mostly reinforcing information — a factor in modern polarization."},
  {id:150,unit:"Unit 5",topic:"5.13",type:"Stimulus-Based",difficulty:"Hard",
   stimulus:{type:"data",source:"Pew Research — Trust in National News Media by Party ID (%, 2023)",text:"                                Democrats   Republicans\nTrust national news 'a lot':         35%          10%\nTrust 'some':                         45%          35%\nDistrust:                             20%          55%"},
   stem:"Which conclusion is BEST supported by the data?",
   choices:["Democrats and Republicans trust national media equally.","Trust in national news media is deeply partisan, with Republicans substantially more distrustful than Democrats.","A majority of both parties distrusts national media.","Trust in media is increasing across the board."],
   correct:1,hint:"Compare the 'distrust' and 'trust a lot' rows across the two parties.",
   wrongNotes:["The differences (35 vs. 10 and 20 vs. 55) are large, not equal.","CORRECT — Republicans' 55% distrust dwarfs Democrats' 20%.","Only Republicans show majority distrust (55%); Democrats do not.","The data is a snapshot, not a trend showing increase."],
   explanation:"Partisan differences in media trust are now a defining feature of American politics. This pattern influences where citizens get news and how messages are received."},

  {id:151,unit:"Unit 5",topic:"5.2",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"chart",source:"U.S. Census Bureau, Current Population Survey (November 2020)",svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 205" width="100%" style="font-family:Arial,sans-serif;display:block"><text x="280" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#222">Voter Turnout by Age Group — 2020 Presidential Election</text><text x="280" y="25" text-anchor="middle" font-size="8" fill="#777">Source: U.S. Census Bureau, Current Population Survey (November 2020)</text><line x1="50" y1="180" x2="540" y2="180" stroke="#bbb" stroke-width="1"/><line x1="50" y1="105" x2="540" y2="105" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/><line x1="50" y1="67" x2="540" y2="67" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/><line x1="50" y1="142" x2="540" y2="142" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/><text x="44" y="184" font-size="8" fill="#666" text-anchor="end">0%</text><text x="44" y="146" font-size="8" fill="#666" text-anchor="end">25%</text><text x="44" y="109" font-size="8" fill="#666" text-anchor="end">50%</text><text x="44" y="71" font-size="8" fill="#666" text-anchor="end">75%</text><rect x="52" y="103" width="50" height="77" fill="#2D5D8B" rx="2"/><text x="77" y="99" font-size="9" font-weight="700" fill="#2D5D8B" text-anchor="middle">51%</text><text x="77" y="194" font-size="8.5" fill="#444" text-anchor="middle">18–24</text><rect x="122" y="92" width="50" height="88" fill="#2D5D8B" rx="2"/><text x="147" y="88" font-size="9" font-weight="700" fill="#2D5D8B" text-anchor="middle">59%</text><text x="147" y="194" font-size="8.5" fill="#444" text-anchor="middle">25–34</text><rect x="192" y="83" width="50" height="97" fill="#2D5D8B" rx="2"/><text x="217" y="79" font-size="9" font-weight="700" fill="#2D5D8B" text-anchor="middle">65%</text><text x="217" y="194" font-size="8.5" fill="#444" text-anchor="middle">35–44</text><rect x="262" y="78" width="50" height="102" fill="#2D5D8B" rx="2"/><text x="287" y="74" font-size="9" font-weight="700" fill="#2D5D8B" text-anchor="middle">68%</text><text x="287" y="194" font-size="8.5" fill="#444" text-anchor="middle">45–54</text><rect x="332" y="72" width="50" height="108" fill="#1B2A4A" rx="2"/><text x="357" y="68" font-size="9" font-weight="700" fill="#1B2A4A" text-anchor="middle">72%</text><text x="357" y="194" font-size="8.5" fill="#444" text-anchor="middle">55–64</text><rect x="402" y="66" width="50" height="114" fill="#1B2A4A" rx="2"/><text x="427" y="62" font-size="9" font-weight="700" fill="#1B2A4A" text-anchor="middle">76%</text><text x="427" y="194" font-size="8.5" fill="#444" text-anchor="middle">65–74</text><rect x="472" y="75" width="50" height="105" fill="#1B2A4A" rx="2"/><text x="497" y="71" font-size="9" font-weight="700" fill="#1B2A4A" text-anchor="middle">70%</text><text x="497" y="194" font-size="8.5" fill="#444" text-anchor="middle">75+</text></svg>`},
   stem:"Which conclusion is BEST supported by the data shown?",
   choices:["Voter turnout is highest among the 18–24 age group.","Turnout consistently increases with age, peaking at 65–74, before declining slightly among those 75+.","All age groups turned out at approximately the same rate in 2020.","Voters over 65 turned out at lower rates than those aged 35–54."],
   correct:1,hint:"Trace the bar heights from youngest to oldest — is the pattern consistent?",
   wrongNotes:["18–24 had the LOWEST turnout (51%) — the opposite.","CORRECT — turnout rises from 51% (18–24) to a peak of 76% (65–74), then dips to 70% (75+).","There is a 25-point gap between the youngest and peak groups — far from uniform.","65–74 had the highest turnout of any group (76%)."],
   explanation:"Voter turnout rises consistently with age, peaking at 76% for the 65–74 cohort before dipping slightly for those 75+. Older Americans vote at much higher rates due to greater civic habits, more flexible schedules, and higher socioeconomic status. The 25-point gap between youngest and oldest is a persistent feature of American elections."},

  {id:152,unit:"Unit 4",topic:"4.3",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"chart",source:"Congressional Quarterly Party Unity Scores, 1970–2020",svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="100%" style="font-family:Arial,sans-serif;display:block"><text x="280" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#222">Congressional Party-Line Voting, 1970–2020</text><text x="280" y="25" text-anchor="middle" font-size="8" fill="#777">% of House members voting with party majority · Source: CQ Party Unity Scores</text><line x1="65" y1="35" x2="65" y2="185" stroke="#bbb" stroke-width="1"/><line x1="65" y1="185" x2="545" y2="185" stroke="#bbb" stroke-width="1"/><line x1="65" y1="155" x2="545" y2="155" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="65" y1="125" x2="545" y2="125" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="65" y1="95" x2="545" y2="95" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="65" y1="65" x2="545" y2="65" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><text x="58" y="188" font-size="8" fill="#666" text-anchor="end">50%</text><text x="58" y="158" font-size="8" fill="#666" text-anchor="end">60%</text><text x="58" y="128" font-size="8" fill="#666" text-anchor="end">70%</text><text x="58" y="98" font-size="8" fill="#666" text-anchor="end">80%</text><text x="58" y="68" font-size="8" fill="#666" text-anchor="end">90%</text><text x="65" y="198" font-size="8.5" fill="#444" text-anchor="middle">1970</text><text x="160" y="198" font-size="8.5" fill="#444" text-anchor="middle">1980</text><text x="255" y="198" font-size="8.5" fill="#444" text-anchor="middle">1990</text><text x="350" y="198" font-size="8.5" fill="#444" text-anchor="middle">2000</text><text x="445" y="198" font-size="8.5" fill="#444" text-anchor="middle">2010</text><text x="540" y="198" font-size="8.5" fill="#444" text-anchor="middle">2020</text><polyline points="65,164 160,128 255,92 350,86 445,62 540,59" fill="none" stroke="#2D5D8B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="65" cy="164" r="4" fill="#2D5D8B"/><circle cx="160" cy="128" r="4" fill="#2D5D8B"/><circle cx="255" cy="92" r="4" fill="#2D5D8B"/><circle cx="350" cy="86" r="4" fill="#2D5D8B"/><circle cx="445" cy="62" r="4" fill="#2D5D8B"/><circle cx="540" cy="59" r="4" fill="#2D5D8B"/><polyline points="65,158 160,119 255,113 350,71 445,74 540,65" fill="none" stroke="#B22234" stroke-width="2.5" stroke-linejoin="round"/><circle cx="65" cy="158" r="4" fill="#B22234"/><circle cx="160" cy="119" r="4" fill="#B22234"/><circle cx="255" cy="113" r="4" fill="#B22234"/><circle cx="350" cy="71" r="4" fill="#B22234"/><circle cx="445" cy="74" r="4" fill="#B22234"/><circle cx="540" cy="65" r="4" fill="#B22234"/><line x1="380" y1="42" x2="393" y2="42" stroke="#2D5D8B" stroke-width="2.5"/><circle cx="386" cy="42" r="3" fill="#2D5D8B"/><text x="397" y="46" font-size="9" fill="#444">Democrats</text><line x1="380" y1="56" x2="393" y2="56" stroke="#B22234" stroke-width="2.5"/><circle cx="386" cy="56" r="3" fill="#B22234"/><text x="397" y="60" font-size="9" fill="#444">Republicans</text></svg>`},
   stem:"Which conclusion is BEST supported by the congressional voting data?",
   choices:["Bipartisan cooperation has increased substantially since 1970.","Both parties show a long-term increase in party-line voting, reflecting rising political polarization.","Democrats have consistently voted with their party at higher rates than Republicans.","Party-line voting peaked in 1990 and declined thereafter."],
   correct:1,hint:"Look at the overall direction of BOTH trend lines from 1970 to 2020.",
   wrongNotes:["The data shows the opposite — rising party-line voting means LESS bipartisan cooperation.","CORRECT — both lines trend sharply upward from ~57–59% (1970) to ~90–92% (2020), indicating rising polarization in both parties.","The lines were comparable through 1990; Republicans surged ahead around 2000.","Both lines trend upward throughout; there is no sustained peak-and-decline."],
   explanation:"Party-line voting has increased dramatically for both parties since 1970. Today both parties vote with their majority at roughly 90%+ vs. ~58% in 1970. This reflects ideological sorting — moderates have left both parties, making the average Democrat more liberal and the average Republican more conservative."},

  {id:153,unit:"Unit 4",topic:"4.1",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"chart",source:"Pew Research Center, American Trends Panel (selected years)",svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="100%" style="font-family:Arial,sans-serif;display:block"><text x="280" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#222">Public Trust in the Federal Government, 1964–2022</text><text x="280" y="25" text-anchor="middle" font-size="8" fill="#777">% saying they trust government to do what is right "always" or "most of the time" · Source: Pew Research Center</text><line x1="60" y1="35" x2="60" y2="185" stroke="#bbb" stroke-width="1"/><line x1="60" y1="185" x2="545" y2="185" stroke="#bbb" stroke-width="1"/><line x1="60" y1="148" x2="545" y2="148" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="60" y1="110" x2="545" y2="110" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="60" y1="72" x2="545" y2="72" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><text x="54" y="188" font-size="8" fill="#666" text-anchor="end">0%</text><text x="54" y="151" font-size="8" fill="#666" text-anchor="end">20%</text><text x="54" y="113" font-size="8" fill="#666" text-anchor="end">40%</text><text x="54" y="75" font-size="8" fill="#666" text-anchor="end">60%</text><text x="54" y="38" font-size="8" fill="#666" text-anchor="end">80%</text><polygon points="60,44 129,118 197,138 266,151 334,84 403,129 471,144 540,148 540,185 60,185" fill="#2D5D8B" opacity="0.07"/><polyline points="60,44 129,118 197,138 266,151 334,84 403,129 471,144 540,148" fill="none" stroke="#2D5D8B" stroke-width="2.5" stroke-linejoin="round"/><circle cx="60" cy="44" r="4" fill="#2D5D8B"/><text x="66" y="40" font-size="7.5" fill="#2D5D8B" font-weight="700">75%</text><circle cx="129" cy="118" r="4" fill="#2D5D8B"/><circle cx="197" cy="138" r="4" fill="#2D5D8B"/><circle cx="266" cy="151" r="4" fill="#B22234"/><text x="270" y="147" font-size="7.5" fill="#B22234" font-weight="700">18%</text><circle cx="334" cy="84" r="4" fill="#2D5D8B"/><text x="338" y="80" font-size="7.5" fill="#2D5D8B" font-weight="700">54%</text><circle cx="403" cy="129" r="4" fill="#2D5D8B"/><circle cx="471" cy="144" r="4" fill="#2D5D8B"/><circle cx="540" cy="148" r="4" fill="#B22234"/><text x="530" y="163" font-size="7.5" fill="#B22234" font-weight="700">20%</text><text x="60" y="198" font-size="8" fill="#444" text-anchor="middle">1964</text><text x="129" y="198" font-size="8" fill="#444" text-anchor="middle">1974</text><text x="197" y="198" font-size="8" fill="#444" text-anchor="middle">1980</text><text x="266" y="198" font-size="8" fill="#444" text-anchor="middle">1994</text><text x="334" y="198" font-size="8" fill="#444" text-anchor="middle">2001</text><text x="403" y="198" font-size="8" fill="#444" text-anchor="middle">2008</text><text x="471" y="198" font-size="8" fill="#444" text-anchor="middle">2015</text><text x="540" y="198" font-size="8" fill="#444" text-anchor="middle">2022</text></svg>`},
   stem:"Which best describes the overall trend in public trust shown in the data?",
   choices:["Trust has remained stable near 40–50% since 1964.","Trust has generally declined since the 1960s, with only brief recoveries, reaching historic lows in recent decades.","A single crisis in the early 1990s permanently destroyed public trust.","The data shows a clear upward trend in trust since 1980."],
   correct:1,hint:"Compare the 1964 starting point (75%) to recent values. Note the brief 2001 recovery — did it last?",
   wrongNotes:["Trust started at 75% and has mostly been below 25% in recent decades — not stable at 40–50%.","CORRECT — trust fell from 75% (1964) to 18% (1994), briefly recovered to 54% after 9/11 (2001), then collapsed again to ~20%.","Trust fell gradually through the 1970s and 1980s — it was a multi-decade erosion, not a single event.","The long-run trend is clearly downward; the 2001 recovery was temporary."],
   explanation:"Public trust in government fell from ~75% in 1964 to sustained lows under 25% since the mid-1990s. The post-9/11 rally (2001: 54%) was short-lived. Long-run trust decline is driven by Vietnam, Watergate, partisan polarization, and institutional failures. This is a defining feature of modern American political culture."},

Tech / Communications</text><text x="396" y="92" font-size="8.5" fill="#fff" font-weight="700">$520M</text><rect x="118" y="101" width="231" height="17" fill="#4A7BB5" rx="2"/><text x="112" y="114" font-size="9" fill="#444" text-anchor="end">Energy / Nat. Resources</text><text x="354" y="114" font-size="8.5" fill="#fff" font-weight="700">$440M</text><rect x="118" y="123" width="105" height="17" fill="#748092" rx="2"/><text x="112" y="136" font-size="9" fill="#444" text-anchor="end">Transportation</text><text x="228" y="136" font-size="8.5" fill="#fff" font-weight="700">$200M</text><rect x="118" y="145" width="84" height="17" fill="#748092" rx="2"/><text x="112" y="158" font-size="9" fill="#444" text-anchor="end">Defense</text><text x="206" y="158" font-size="8.5" fill="#555" font-weight="700">$160M</text></svg>`},
   stem:"Which conclusion is BEST supported by the lobbying expenditure data?",
   choices:["All sectors spend roughly equal amounts, suggesting no single industry dominates.","Defense contractors are the most powerful lobbying force in Washington.","Financial and healthcare industries spend the most on lobbying, reflecting their high stakes in federal regulation.","Total lobbying spending in the U.S. is under $500 million annually."],
   correct:2,hint:"Compare bar lengths. Why would Finance and Health lead all other sectors?",
   wrongNotes:["The gap between Finance ($730M) and Defense ($160M) is enormous — far from equal.","Defense is near the bottom at $160M. Finance/Insurance leads at $730M.","CORRECT — Finance ($730M) and Health ($680M) dominate because federal banking rules, tax law, drug pricing, and insurance regulations directly affect their profits.","Finance alone spends $730M; total across sectors shown exceeds $2.7 billion."],
   explanation:"Financial services and healthcare consistently lead lobbying spending because federal law directly determines their market conditions — interest rates, drug approval, insurance mandates, and tax treatment. This illustrates how concentrated interests (high per-member stakes) overcome the free-rider problems that limit diffuse groups."},
