   stimulus:{type:"chart",source:"Federal Election Commission / OpenSecrets (2000–2020)",svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="100%" style="font-family:Arial,sans-serif;display:block"><text x="280" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#222">Total Federal Election Spending, 2000–2020</text><text x="280" y="25" text-anchor="middle" font-size="8" fill="#777">All candidates, parties, and outside groups combined ($ billions) · Source: FEC / OpenSecrets</text><line x1="50" y1="35" x2="50" y2="185" stroke="#bbb" stroke-width="1"/><line x1="50" y1="185" x2="545" y2="185" stroke="#bbb" stroke-width="1"/><line x1="50" y1="148" x2="545" y2="148" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="50" y1="110" x2="545" y2="110" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="50" y1="72" x2="545" y2="72" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><text x="44" y="188" font-size="8" fill="#666" text-anchor="end">$0</text><text x="44" y="151" font-size="8" fill="#666" text-anchor="end">$4B</text><text x="44" y="113" font-size="8" fill="#666" text-anchor="end">$8B</text><text x="44" y="75" font-size="8" fill="#666" text-anchor="end">$12B</text><text x="44" y="38" font-size="8" fill="#666" text-anchor="end">$16B</text><rect x="55" y="157" width="68" height="28" fill="#748092" rx="2"/><text x="89" y="153" font-size="9" font-weight="700" fill="#748092" text-anchor="middle">$3.0B</text><text x="89" y="197" font-size="8.5" fill="#444" text-anchor="middle">2000</text><rect x="138" y="146" width="68" height="39" fill="#748092" rx="2"/><text x="172" y="142" font-size="9" font-weight="700" fill="#748092" text-anchor="middle">$4.2B</text><text x="172" y="197" font-size="8.5" fill="#444" text-anchor="middle">2004</text><rect x="221" y="135" width="68" height="50" fill="#4A7BB5" rx="2"/><text x="255" y="131" font-size="9" font-weight="700" fill="#4A7BB5" text-anchor="middle">$5.3B</text><text x="255" y="197" font-size="8.5" fill="#444" text-anchor="middle">2008</text><rect x="304" y="126" width="68" height="59" fill="#2D5D8B" rx="2"/><text x="338" y="122" font-size="9" font-weight="700" fill="#2D5D8B" text-anchor="middle">$6.3B</text><text x="338" y="197" font-size="8.5" fill="#444" text-anchor="middle">2012</text><rect x="387" y="124" width="68" height="61" fill="#2D5D8B" rx="2"/><text x="421" y="120" font-size="9" font-weight="700" fill="#2D5D8B" text-anchor="middle">$6.5B</text><text x="421" y="197" font-size="8.5" fill="#444" text-anchor="middle">2016</text><rect x="470" y="50" width="68" height="135" fill="#B22234" rx="2"/><text x="504" y="46" font-size="9" font-weight="700" fill="#B22234" text-anchor="middle">$14.4B</text><text x="504" y="197" font-size="8.5" fill="#444" text-anchor="middle">2020</text><line x1="350" y1="185" x2="350" y2="100" stroke="#C9A84C" stroke-width="1.5" stroke-dasharray="3,2"/><text x="354" y="98" font-size="7.5" fill="#C9A84C" font-weight="700">Citizens United (2010)</text></svg>`},
   stem:"A student claims: 'Citizens United caused campaign spending to spike.' Which is the most accurate critique of this argument?",
   choices:["Entirely correct — spending was flat before 2010 and only rose after.","Spending was already growing before 2010; Citizens United likely accelerated the trend but is not the sole cause.","Campaign spending actually decreased after Citizens United.","Citizens United had no measurable effect on campaign spending whatsoever."],
   correct:1,hint:"Was spending flat or growing before the 2010 Citizens United decision?",
   wrongNotes:["Spending grew from $3B (2000) to $5.3B (2008) before Citizens United — it was not flat.","CORRECT — the pre-2010 growth trend already existed. Citizens United expanded outside spending, and combined with digital fundraising, contributed to the 2020 surge (+121%), but was not the sole cause.","The data clearly shows continued growth after 2010, not a decrease.","The post-Citizens United period shows a clear acceleration, especially in 2020 outside spending."],
   explanation:"Citizens United v. FEC (2010) enabled unlimited corporate and union independent expenditures. While the ruling likely contributed to the long-run spending surge, total spending was already growing steadily from $3B (2000) to $6.3B (2012). The 2020 spike reflects Citizens United's cumulative effects plus unprecedented digital small-dollar fundraising."},

  {id:156,unit:"Unit 5",topic:"5.2",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"chart",source:"U.S. Census Bureau CPS / American National Election Studies (2020)",svg:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 205" width="100%" style="font-family:Arial,sans-serif;display:block"><text x="280" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#222">Voter Turnout by Family Income — 2020 Presidential Election</text><text x="280" y="25" text-anchor="middle" font-size="8" fill="#777">Reported turnout among eligible citizens · Source: U.S. Census Bureau CPS / ANES</text><line x1="50" y1="185" x2="545" y2="185" stroke="#bbb" stroke-width="1"/><line x1="50" y1="104" x2="545" y2="104" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/><line x1="50" y1="63" x2="545" y2="63" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/><line x1="50" y1="144" x2="545" y2="144" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/><text x="44" y="188" font-size="8" fill="#666" text-anchor="end">0%</text><text x="44" y="147" font-size="8" fill="#666" text-anchor="end">25%</text><text x="44" y="107" font-size="8" fill="#666" text-anchor="end">50%</text><text x="44" y="66" font-size="8" fill="#666" text-anchor="end">75%</text><rect x="62" y="125" width="75" height="60" fill="#748092" rx="2"/><text x="99" y="121" font-size="9" font-weight="700" fill="#748092" text-anchor="middle">40%</text><text x="99" y="197" font-size="8" fill="#444" text-anchor="middle">Under $30K</text><rect x="167" y="110" width="75" height="75" fill="#4A7BB5" rx="2"/><text x="204" y="106" font-size="9" font-weight="700" fill="#4A7BB5" text-anchor="middle">52%</text><text x="204" y="197" font-size="8" fill="#444" text-anchor="middle">$30K–$50K</text><rect x="272" y="93" width="75" height="92" fill="#2D5D8B" rx="2"/><text x="309" y="89" font-size="9" font-weight="700" fill="#2D5D8B" text-anchor="middle">63%</text><text x="309" y="197" font-size="8" fill="#444" text-anchor="middle">$50K–$75K</text><rect x="377" y="78" width="75" height="107" fill="#1B2A4A" rx="2"/><text x="414" y="74" font-size="9" font-weight="700" fill="#1B2A4A" text-anchor="middle">72%</text><text x="414" y="197" font-size="8" fill="#444" text-anchor="middle">$75K–$100K</text><rect x="482" y="65" width="52" height="120" fill="#1B2A4A" rx="2"/><text x="508" y="61" font-size="9" font-weight="700" fill="#1B2A4A" text-anchor="middle">80%</text><text x="508" y="197" font-size="8" fill="#444" text-anchor="middle">Over $100K</text></svg>`},
   stem:"Which explanation BEST accounts for the income-turnout pattern shown?",
   choices:["Low-income citizens are less patriotic and therefore less motivated to vote.","Higher-income citizens possess more resources — education, flexible schedules, and civic confidence — that facilitate political participation.","The data shows income has no meaningful effect on turnout.","Federal law limits voting rights for citizens below the poverty line."],
   correct:1,hint:"Think about the resource model of participation — what advantages do higher-income voters have?",
   wrongNotes:["Research consistently finds structural barriers, not patriotism, explain the income gap in turnout.","CORRECT — the resource model: higher income correlates with more education, schedule flexibility, civic confidence, and less shift-work conflict with Election Day.","There is a 40-point gap between lowest and highest income groups — a well-documented and significant relationship.","No such law exists. The 24th Amendment (1964) abolished poll taxes; income-based voting restrictions are unconstitutional."],
   explanation:"Income is one of the strongest predictors of turnout. Higher-income citizens have more education (which increases political knowledge and efficacy), more flexible schedules, and greater confidence in civic institutions. The 40-point gap between under-$30K (40%) and over-$100K (80%) reflects structural inequality in political participation."},

  // ── TEXT-BASED TOPIC FILL QUESTIONS ───────────────────────────
  {id:158,unit:"Unit 3",topic:"3.9",type:"Concept Application",difficulty:"Medium",
   stem:"Police arrest a suspect and begin questioning before reading Miranda warnings. The suspect confesses. What is MOST likely to happen to that confession in court?",
   choices:["It is fully admissible because the suspect volunteered the information.","It is likely inadmissible — Miranda warnings are required before custodial interrogation.","It is admissible if the judge finds no physical coercion was used.","The Fifth Amendment only applies to trial testimony, not police questioning."],
   correct:1,hint:"Miranda v. Arizona (1966) — what specific circumstance triggers the warning requirement?",
   wrongNotes:["'Volunteering' does not matter — the issue is whether warnings were given before custodial interrogation.","CORRECT — Miranda v. Arizona (1966) requires police to warn suspects of their right to silence and counsel before custodial interrogation; a confession obtained without warnings is generally inadmissible under the exclusionary rule.","Miranda is not limited to physical coercion — the inherent pressure of custody itself triggers the requirement.","The 5th Amendment privilege against self-incrimination applies to police interrogation under Miranda, not just trial testimony."],
   explanation:"Miranda v. Arizona (1966) required police to inform suspects of their 5th Amendment right to silence and 6th Amendment right to counsel before custodial interrogation. Evidence obtained without these warnings is excluded under the exclusionary rule. Miranda reflects selective incorporation of the 5th and 6th Amendments against states."},

  {id:159,unit:"Unit 3",topic:"3.8",type:"Concept Application",difficulty:"Medium",
   stem:"A state law requires criminal defendants to prove their own innocence beyond a reasonable doubt. A defendant challenges the law. The strongest constitutional basis for striking it down is:",
   choices:["The First Amendment, because the law restricts the defendant's free expression.","The Fourteenth Amendment's Due Process Clause — shifting the burden of proof violates fundamental fairness.","The Commerce Clause, because criminal procedure affects interstate business.","The Eighth Amendment's ban on cruel and unusual punishment."],
   correct:1,hint:"Procedural due process includes what fundamental guarantee about who must prove a criminal case?",
   wrongNotes:["This is a criminal procedure question — the First Amendment's speech protections are irrelevant.","CORRECT — substantive and procedural due process under the 14th Amendment requires the government to prove guilt; forcing defendants to prove innocence inverts this fundamental guarantee.","The Commerce Clause governs congressional power to regulate commerce, not state criminal procedure.","The 8th Amendment governs sentencing and punishment, not trial procedures like burden of proof."],
   explanation:"Procedural due process guarantees the presumption of innocence and requires the government to prove guilt beyond a reasonable doubt. These protections flow from the 14th Amendment's Due Process Clause as applied to state courts through selective incorporation. Reversing the burden of proof violates this core guarantee."},

  {id:160,unit:"Unit 3",topic:"3.12",type:"SCOTUS",difficulty:"Hard",
   stem:"Obergefell v. Hodges (2015) established a constitutional right to same-sex marriage primarily by applying which provisions of the Constitution?",
   choices:["The First Amendment's Free Exercise Clause and the Supremacy Clause.","The Due Process Clause and Equal Protection Clause of the Fourteenth Amendment.","The Ninth Amendment's reservation of unenumerated rights to the people.","Article I's grant of regulatory power to Congress over the states."],
   correct:1,hint:"Which amendment has been used most broadly to extend fundamental rights to historically excluded groups?",
   wrongNotes:["Free Exercise protects religious practice from government prohibition — it was not the basis for Obergefell. The Supremacy Clause is a federalism provision, not a rights provision.","CORRECT — Justice Kennedy's majority relied on both the Due Process Clause (marriage as a fundamental liberty) and the Equal Protection Clause (denial based on sexual orientation) of the 14th Amendment.","While Kennedy briefly mentioned the 9th Amendment, the ruling's constitutional foundation was the 14th Amendment.","Marriage law is a state function; Obergefell addressed constitutional limits on state authority, not congressional power."],
   explanation:"Obergefell v. Hodges (2015) held that same-sex couples have a fundamental right to marry under both the Due Process Clause (as a fundamental liberty protected against state interference) and the Equal Protection Clause (requiring equal treatment) of the 14th Amendment. Kennedy wrote for a 5–4 majority.",
   scotus:{name:"Obergefell v. Hodges",year:"2015"}},
  // ── PEWS CHART IMAGE QUESTIONS ─────────────────────────────
  // Unit 1 — Foundations / Public Opinion
  {id:200,unit:"Unit 1",topic:"1.3",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U1_01_partisan_attention_vs_issues.png",source:"Pew Research Center, July 2023"},
   stem:"Based on the chart, which conclusion about American public opinion is BEST supported?",
   choices:["Most Americans believe partisan disagreements between Republicans and Democrats receive too little attention.","Large majorities say important issues and policies receive too little attention, while partisan fighting receives too much.","Americans are roughly split on whether the 2024 presidential election received too much or too little coverage.","Respondents are most dissatisfied with the amount of coverage given to local elected officials."],
   correct:1,
   hint:"Look at which items are rated 'too much' vs. 'too little' — and which gets the highest 'too little' score.",
   wrongNotes:["The chart shows 57% say partisan disagreements get TOO MUCH attention, not too little.","CORRECT — 78% say important issues get too little attention; 64–66% say the same about policies; 57% say partisan fighting gets too much.","The chart shows 39% say the election gets too much, 22% too little — a divided result, not a majority view.","Local officials rank lower on 'too little' than important issues or Washington policies."],
   explanation:"The chart reveals a widespread sense that partisan fighting crowds out substantive policy: 78% say major issues get too little attention while 57% say partisan disagreements already get too much — a pattern consistent with growing frustration over polarization."},

  {id:201,unit:"Unit 1",topic:"1.1",type:"Quantitative Analysis",difficulty:"Easy",
   stimulus:{type:"image",src:"uploads/U1_02_feelings_about_politics.png",source:"Pew Research Center, July 2023"},
   stem:"The data on how Americans feel about politics BEST illustrates which concept?",
   choices:["High levels of civic engagement and political efficacy among American adults.","Widespread political alienation, with fatigue and anger far outpacing hope or excitement.","Equal balance between positive and negative emotional responses to politics.","A sharp partisan divide in emotional responses to the political system."],
   correct:1,
   hint:"Compare the 'always/often' percentages for exhausted/angry vs. hopeful/excited.",
   wrongNotes:["High efficacy would show more positive emotions like excitement and hope — the opposite of what the chart shows.","CORRECT — 65% feel exhausted and 55% feel angry always/often, while only 10% feel hopeful and 4% excited always/often.","The chart is dramatically skewed toward negative emotions — there is no balance.","The chart shows overall public emotion, not broken down by party."],
   explanation:"Political alienation — a sense of disconnection, frustration, and disillusionment with the political system — is reflected in high rates of exhaustion (65%) and anger (55%) compared to very low rates of hope (10%) and excitement (4%)."},

  {id:202,unit:"Unit 1",topic:"1.2",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U1_03_descriptions_of_politics.png",source:"Pew Research Center, July 2023"},
   stem:"The word cloud showing Americans' descriptions of politics most directly supports which argument?",
   choices:["Americans hold broadly positive views of the democratic process.","Public trust in government institutions remains high and stable.","Widespread negative public opinion about politics threatens democratic legitimacy.","Americans primarily describe politics in terms of specific policy failures."],
   correct:2,
   hint:"Look at the size and content of the most common words chosen.",
   wrongNotes:["Every large bubble contains a negative word — 'divisive,' 'corrupt,' 'bad,' 'chaos.' No positive words appear prominently.","High and stable trust would not produce words like 'corrupt,' 'dysfunctional,' and 'chaos.'","CORRECT — the dominant terms (divisive, corrupt, bad, messy, chaos) reflect deep public cynicism that can erode the legitimacy that democratic government requires.","Words like 'divisive' and 'corrupt' describe the system itself, not specific policies."],
   explanation:"Democratic legitimacy rests on public acceptance of government as rightful. When citizens most commonly describe politics as 'divisive,' 'corrupt,' and 'chaotic,' it signals a crisis of confidence that can undermine participation and institutional trust."},

  {id:203,unit:"Unit 1",topic:"1.3",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U1_04_unfavorable_both_parties.png",source:"Pew Research Center / American Trends Panel"},
   stem:"The trend shown in the chart BEST supports which conclusion about the American party system?",
   choices:["The two major parties have grown more popular with voters over time.","Growing numbers of Americans view both major parties unfavorably, suggesting possible dealignment.","Third parties have captured a significant share of the electorate since 1994.","Republican unfavorability has driven the overall trend."],
   correct:1,
   hint:"When the percentage holding unfavorable views of BOTH parties rises, what does that tell you about voters' relationship with the two-party system?",
   wrongNotes:["The trend lines upward — both parties are becoming less popular, not more.","CORRECT — rising from 6% in 1994 to 27% in 2022, this trend reflects growing voter dissatisfaction with both parties, consistent with dealignment.","The chart tracks unfavorability of the two major parties, not third-party vote share.","The chart measures combined unfavorability of both parties, not one party's individual trend."],
   explanation:"Dealignment occurs when voters detach from both major parties. The near-tripling of dual unfavorability (6%→27%) since 1994 is consistent with this trend and helps explain rising independent identification."},

  {id:204,unit:"Unit 1",topic:"1.3",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U1_05_support_more_parties.png",source:"Pew Research Center, June–July 2022"},
   stem:"Based on the chart, which group shows the GREATEST support for more political parties, and what structural barrier most directly limits third-party viability?",
   choices:["Republicans; the Electoral College","Independents and leaners; winner-take-all (plurality) electoral rules","Democrats; proportional representation in Congress","Lean Democrats; the two-term presidential limit"],
   correct:1,
   hint:"Find who most wants more parties, then think about what electoral rule (Duverger's Law) suppresses third parties.",
   wrongNotes:["Republicans show the least desire for more parties (only 21% 'extremely/very well'). The Electoral College affects presidential races but Duverger's Law applies more broadly.","CORRECT — independents/leaners show the highest support (up to 53% 'extremely/very well' for lean-Dem independents); winner-take-all rules create the two-party duopoly by making third-party votes 'wasted.'","Democrats want more parties more than Republicans, but independents still lead. Congress uses single-member districts, not proportional representation.","The two-term limit is a presidency rule; it has no bearing on third-party electoral viability."],
   explanation:"Independents most want more parties, yet Duverger's Law explains why they don't get them: in winner-take-all districts, rational voters abandon third parties to avoid 'wasting' votes, entrenching the two-party system regardless of public preference."},

  // Unit 2 — Interactions Among Branches / Economic Policy
  {id:205,unit:"Unit 2",topic:"2.1",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U2_01_economic_ratings_by_party.png",source:"Pew Research Center, Jan. 2026"},
   stem:"The dramatic swings in partisan economic ratings shown in the chart BEST illustrate which phenomenon?",
   choices:["Objective changes in economic performance tracking closely with party control of the presidency.","Party cue-taking: partisans evaluate economic conditions based largely on which party controls the White House.","Bipartisan consensus on economic policy that shifts when new data is released.","Independent voters driving changes in overall economic sentiment."],
   correct:1,
   hint:"Notice how Republican and Democratic lines swap positions whenever the president's party changes.",
   wrongNotes:["While economic conditions do change, the near-instant and massive swings when presidencies change (e.g., Republicans jumping from 18% to 81% positive after Trump's 2017 inauguration) cannot be explained by actual economic change alone.","CORRECT — the lines mirror each other and reverse sharply at presidential transitions, showing that party identity, not economic reality, primarily drives economic evaluation.","Bipartisan consensus would show both lines moving together, not inverting.","The chart distinguishes Rep/Lean Rep from Dem/Lean Dem lines — independents are not the driver shown here."],
   explanation:"Party cue-taking causes partisans to perceive economic conditions through a partisan lens. The dramatic crossing of the partisan lines at each presidential transition — not gradual shifts tied to economic data — reveals that 'team loyalty' shapes economic perception more than objective conditions."},

  {id:206,unit:"Unit 2",topic:"2.4",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U2_02_economic_concerns.png",source:"Pew Research Center, Jan. 2026"},
   stem:"Based on the chart showing economic concerns, which of the following BEST describes the data's implication for congressional policymaking?",
   choices:["Congressional leaders should prioritize stock market performance, the most widely cited concern.","The near-universal concern about healthcare costs (93%) creates strong electoral incentive for Congress to address it.","Gasoline prices are the top economic concern and should drive energy legislation.","Americans are divided on economic priorities, giving Congress little clear mandate."],
   correct:1,
   hint:"Which item has the highest NET percentage, and what does near-universal public concern mean for legislators?",
   wrongNotes:["The stock market has the lowest NET concern at 58% — it ranks last among the seven items.","CORRECT — at 93% NET concern, healthcare costs are virtually universal. Elected officials who ignore issues with near-universal salience face electoral consequences.","Gasoline prices rank 6th at 68% NET concern, well below healthcare, food, and housing.","Healthcare (93%), food (92%), and housing (89%) all show overwhelming consensus, not division."],
   explanation:"When an economic issue reaches near-universal salience (93%), it represents a powerful mandate signal. Congress responds to constituent pressure — issues this salient become central to campaigns and legislative agendas regardless of partisan differences."},

  {id:207,unit:"Unit 2",topic:"2.3",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U2_03_economic_outlook.png",source:"Pew Research Center, Jan. 2026"},
   stem:"The economic outlook data most directly illustrates which principle of American politics?",
   choices:["Americans' views of the future economy are shaped primarily by objective economic indicators like GDP growth.","Partisan polarization extends to economic expectations, with co-partisans of the president expressing dramatically more optimism.","Democrats are consistently more pessimistic than Republicans about the economy regardless of who holds the presidency.","Economic outlook is evenly split between better, same, and worse across all partisan groups."],
   correct:1,
   hint:"Compare Republican and Democratic outlooks in February 2025 (early Trump second term) — notice the gap.",
   wrongNotes:["If objective indicators drove views, partisan gaps would be small and lines would move together. The massive partisan divergence contradicts this.","CORRECT — in Feb. 2025 with Trump in office, 73% of Republicans said the economy would be better, versus only 10% of Democrats — a 63-point gap driven by partisan identity, not economic data.","The lines flip depending on who holds the presidency — Democrats were optimistic under Biden, Republicans under Trump. Neither party is consistently pessimistic.","The chart shows dramatic polarization in outlooks, not an even three-way split."],
   explanation:"Partisan perceptual screens filter economic expectations: co-partisans of the sitting president see a brighter future; the opposition sees doom. This pattern, visible across administrations, shows that political identity — not economic reality — anchors economic outlook."},

  {id:208,unit:"Unit 2",topic:"2.2",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U2_04_trump_policies_economy.png",source:"Pew Research Center, Jan. 2026"},
   stem:"The data on views of Trump's economic policies BEST demonstrates which feature of contemporary American politics?",
   choices:["A bipartisan consensus that Trump's policies have been economically beneficial.","Extreme partisan divergence in policy evaluation, with almost no cross-party agreement.","A moderate middle of Americans who are uncertain about the economic effects of executive policy.","Majority approval of Trump's economic policies across all partisan groups."],
   correct:1,
   hint:"Compare the Republican and Democratic bars — how far apart are they on 'better' vs. 'worse'?",
   wrongNotes:["Only 3% of Democrats say policies made things better — that is the opposite of bipartisan agreement.","CORRECT — 57% of Republicans say policies made things better; 85% of Democrats say worse. The partisan gap of ~60+ points on both ends reflects extreme perceptual polarization.","'Not had much effect' is chosen by 19% overall — a modest middle, not a majority uncertain bloc.","Overall, 52% say the economy is worse under these policies — that is majority disapproval, not approval."],
   explanation:"Affective and perceptual polarization mean that identical policies are evaluated through radically different partisan lenses. An 82-point gap between Republicans (57% 'better') and Democrats (85% 'worse') on the same question illustrates how deeply partisanship shapes policy evaluation."},

  {id:209,unit:"Unit 2",topic:"2.5",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U2_05_partisan_coalitions_income.png",source:"Pew Research Center / 2023 American Trends Panel"},
   stem:"Based on the chart on partisan coalitions by income and education, which conclusion is BEST supported?",
   choices:["College-educated voters lean Republican at higher rates than non-college voters across all income levels.","Among non-college voters, Republican identification increases substantially as income rises.","Democratic identification is strongest among upper-income non-college voters.","Income has no meaningful effect on partisan identification among non-college voters."],
   correct:1,
   hint:"Follow the 'No college degree' dots across income tiers — what happens to the Republican percentage as income rises?",
   wrongNotes:["College degree holders lean Democratic across income tiers (42–43% Republican), not Republican.","CORRECT — non-college Republican identification rises from 40% (lower/lower-middle) to 57% (middle) to 63% (upper/upper-middle), a 23-point climb with income.","Democratic identification would be the inverse of the Republican numbers shown; upper-income non-college voters lean most Republican.","The 23-point difference between lower-income and upper-income non-college Republican identification is highly meaningful."],
   explanation:"The working-class realignment toward Republicans is income-stratified: non-college voters at higher income tiers identify more strongly Republican, suggesting economic interest combined with cultural factors drives the coalition shift — not education alone."},

  // Unit 3 — Civil Liberties / Civil Rights
  {id:210,unit:"Unit 3",topic:"3.10",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U3_01_political_values_by_issue.png",source:"Pew Research Center, Sept. 2019"},
   stem:"The chart showing partisan gaps by issue area BEST supports which conclusion about civil liberties politics?",
   choices:["Partisan disagreement on civil liberties issues is smallest on gun policy and racial attitudes.","Gun policy and racial attitudes are the most polarized issue areas, with average gaps exceeding 55 percentage points.","All issue areas show roughly equal partisan gaps of around 39 percentage points.","Foreign policy produces the sharpest partisan divisions in American politics."],
   correct:1,
   hint:"Find the two issue areas with the highest average party gap scores.",
   wrongNotes:["Gun policy (57 avg gap) and racial attitudes (55 avg gap) are the MOST polarized, not least.","CORRECT — gun policy averages a 57-point party gap and racial attitudes 55 points, far above the 39-point overall average.","The 39-point average masks wide variation; gun and race far exceed it while religious values (20 points) fall well below.","Foreign policy has a 27-point average gap — well below guns and race."],
   explanation:"The data reveals that gun policy and racial attitudes are the most intensely polarized civil liberties issue areas — exactly the issues most likely to produce gridlock in Congress and contentious Supreme Court cases, since the partisan divide makes bipartisan resolution nearly impossible."},

  {id:211,unit:"Unit 3",topic:"3.4",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U3_02_partisan_gap_vs_demographics.png",source:"Pew Research Center, Sept. 2019"},
   stem:"The chart comparing partisan gaps to demographic gaps BEST supports which argument about political identity?",
   choices:["Race is the most important dividing line in American political values.","Party identification produces larger differences in political values than race, religion, education, age, or gender.","Education produces slightly larger value differences than party identification.","Gender is the primary driver of political polarization in the United States."],
   correct:1,
   hint:"Compare the bar lengths — which is longest by far?",
   wrongNotes:["Race produces a 17-point gap — real, but less than half the party gap of 39 points.","CORRECT — the partisan gap (39 points) is more than double the race gap (17 points) and far exceeds religion (14), education (10), age (10), and gender (6).","Education produces a 10-point gap — significantly smaller than the 39-point party gap.","Gender produces the smallest gap at 6 points — the opposite of a primary driver."],
   explanation:"This data supports the argument that political socialization into parties produces stronger value alignment than demographic characteristics. Party identity has become the master cleavage of American politics, eclipsing race, religion, and other traditional dividing lines."},

  {id:212,unit:"Unit 3",topic:"3.3",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U3_03_republican_age_gap.png",source:"Pew Research Center, Sept. 2019"},
   stem:"The age gap within the Republican Party shown in the chart has the MOST significant implication for which political process?",
   choices:["Presidential primary elections, where older Republicans dominate turnout and pull candidates rightward.","Gerrymandering, since younger Republicans live in different districts than older Republicans.","The Electoral College, since age determines how states are allocated electoral votes.","Campaign finance, since younger Republicans donate at higher rates than older Republicans."],
   correct:0,
   hint:"Where are policy positions of candidates most shaped by the most ideologically committed and older faction of a party?",
   wrongNotes:["CORRECT — primary electorates skew older and more ideologically consistent. Older Republicans (50+) are more conservative on diplomacy, immigration, and same-sex marriage, pulling primary candidates away from younger Republican views and complicating general election appeal.","Gerrymandering draws districts by geography/partisan advantage, not by age within a party.","Electoral votes are allocated by state population, not age demographics within parties.","The chart shows policy positions, not donation rates."],
   explanation:"Primary elections are where age gaps within parties matter most: older, more conservative Republican voters dominate turnout in primaries, rewarding candidates who reflect their positions rather than the more moderate views of younger Republicans — a dynamic that contributes to polarization."},

  {id:213,unit:"Unit 3",topic:"3.11",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U3_04_democrat_racial_divide.png",source:"Pew Research Center, Sept. 2019"},
   stem:"The racial divide within the Democratic Party shown in the chart BEST illustrates which tension in civil rights representation?",
   choices:["Black Democrats and white Democrats agree on nearly all policy issues, making intraparty divisions negligible.","Despite broad policy agreement, Black and white Democrats diverge significantly on whether belief in God is necessary for morality, complicating coalition unity.","White Democrats are more conservative than Black Democrats on gun control and healthcare.","Black Democrats express less support for racial equality policies than white Democrats."],
   correct:1,
   hint:"Find the item with the biggest gap between Black and white Democrats.",
   wrongNotes:["On the God/morality question, there is a 45-point gap (44% Black vs. 89% white). That is not negligible.","CORRECT — 89% of white Democrats say belief in God is NOT necessary for morality versus only 44% of Black Democrats, a 45-point gap that highlights how religious values can complicate coalition unity even when policy positions largely align.","On gun laws and healthcare, Black and white Democrats are very close (82/88 and 81/86) — no meaningful conservative difference among white Dems.","Black Democrats show strong support for racial equality — 65% say the country hasn't gone far enough."],
   explanation:"Descriptive vs. substantive representation matters here: the Democratic coalition is racially diverse but internally divided on values (especially religion and morality), which can complicate legislative coalitions even when final policy positions are broadly similar."},

  {id:214,unit:"Unit 3",topic:"3.5",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U3_05_democrat_education_split.png",source:"Pew Research Center, Sept. 2019"},
   stem:"The education split within the Democratic Party BEST illustrates which challenge for Democratic policymakers?",
   choices:["College-educated Democrats are more moderate than non-college Democrats on most issues.","On issues like gun control (95% vs. 81%) and immigration (89% vs. 73%), college Democrats are significantly more liberal, making it harder to craft unified legislation.","Non-college Democrats are more supportive of immigration and gun restrictions than college Democrats.","Education has no meaningful impact on policy positions within the Democratic Party."],
   correct:1,
   hint:"Look at the largest gaps between college and non-college Democrats.",
   wrongNotes:["College Democrats are more liberal, not more moderate, on the issues shown.","CORRECT — college Democrats favor stricter gun laws at 95% vs. 81% for non-college (14-point gap), and immigration strengthening at 89% vs. 73% (16-point gap). A party must satisfy both wings, making it harder to craft unified positions.","Non-college Democrats are less supportive on both gun control and immigration than college Democrats.","Gaps of 14–16 points on major policy issues are highly meaningful for coalition management."],
   explanation:"The education gap within the Democratic coalition creates legislative tension: college-educated Democrats push for more ambitious gun and immigration reform, while non-college Democrats are somewhat less liberal, forcing party leaders to find a middle ground that may satisfy neither flank."},

  // Unit 4 — Political Beliefs and Behaviors
  {id:215,unit:"Unit 4",topic:"4.3",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U4_01_ideological_divide_1994_2014.png",source:"Pew Research Center, 2014 Political Polarization Study"},
   stem:"The shrinking ideological overlap between parties from 1994 to 2014 shown in the chart MOST directly illustrates which trend?",
   choices:["Voters have become more moderate and centrist over time.","Political sorting: the parties have become more internally homogeneous and more distant from each other ideologically.","The Democratic Party has moved rightward while the Republican Party remained stable.","Bipartisan cooperation in Congress has increased as ideological similarities grew."],
   correct:1,
   hint:"When the overlapping middle (purple) shrinks and the party peaks separate, what is happening to partisan ideological identity?",
   wrongNotes:["The opposite is true — the 'mixed' middle shrank from 49% to 39% while consistent liberals and conservatives grew.","CORRECT — the shrinking purple overlap shows that fewer Americans hold ideological positions that cross party lines. Parties have 'sorted' so that liberals cluster in one party and conservatives in the other.","Both parties moved — Democrats to the left, Republicans to the right, creating the separated peaks visible in 2014.","Greater ideological distance between parties makes bipartisan cooperation harder, not easier."],
   explanation:"Ideological sorting means the parties have become internally coherent: Democrats are almost entirely liberal, Republicans almost entirely conservative, with little overlap. This sorting underlies congressional polarization and makes compromise on legislation increasingly difficult."},

  {id:216,unit:"Unit 4",topic:"4.4",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U4_02_other_party_as_threat.png",source:"Pew Research Center, 2014 Political Polarization Study"},
   stem:"The data showing that 27% of Democrats and 36% of Republicans view the other party as a 'threat to the nation's well-being' BEST illustrates which concept?",
   choices:["Ideological polarization: disagreement over specific policy issues between parties.","Affective polarization: emotional hostility toward the opposing party that goes beyond policy disagreement.","Realignment: voters switching parties because of changing economic interests.","Dealignment: voters abandoning both parties out of frustration."],
   correct:1,
   hint:"Is this about disagreeing on policy, or about feeling the other party is dangerous?",
   wrongNotes:["Ideological polarization is about policy disagreement — this goes further, to viewing the other party as a national threat.","CORRECT — affective polarization captures emotional animus toward the out-party. Viewing the opposition as a threat to national well-being is a symptom of deep affective, not merely ideological, division.","Realignment involves switching party allegiance, not hostility toward the opposing party.","Dealignment involves detachment from both parties, not hostility directed at one."],
   explanation:"Affective polarization — disliking, fearing, or viewing the other party as fundamentally dangerous — has grown dramatically. This has implications for democratic governance: when the opposition is seen as a threat rather than a legitimate competitor, compromise becomes nearly impossible."},

  {id:217,unit:"Unit 4",topic:"4.7",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U4_03_political_activism_gap.png",source:"Pew Research Center, 2014 Political Polarization Study"},
   stem:"The political activism gap shown in the chart BEST explains which feature of American primary elections?",
   choices:["Moderate and mixed-ideology voters dominate primary electorates, pulling candidates toward the center.","Consistently liberal and conservative voters — who are most active — push primary candidates toward ideological extremes.","Donation rates are higher among mixed-ideology voters, giving centrists disproportionate campaign influence.","Voter turnout is roughly equal across ideological groups, so primaries accurately reflect the median voter."],
   correct:1,
   hint:"Who always votes and donates most? And what does that mean for which candidates win primaries?",
   wrongNotes:["Mixed-ideology voters vote at only 39% — far less than consistent ideologues (58%/78%). They do NOT dominate primaries.","CORRECT — consistently liberal (58% always vote, 31% donate) and consistently conservative (78% always vote, 26% donate) voters dominate primaries, rewarding ideologically extreme candidates over moderates.","Mixed voters donate at only 8% — the lowest rate. Ideologues, not centrists, have disproportionate campaign influence.","Turnout ranges from 39% (mixed) to 78% (consistent conservative) — a 39-point gap that gives ideological extremes outsized primary influence."],
   explanation:"The activism gap creates a structural bias in primaries: ideologically consistent voters show up and donate, so candidates who appeal to the base win nominations — even when those candidates are too extreme for the general electorate. This drives polarization in Congress."},

  {id:218,unit:"Unit 4",topic:"4.3",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U4_04_media_consumption_by_ideology.png",source:"Pew Research Center, 2014 Political Polarization Study"},
   stem:"The change in ideological distribution from 1994 to 2014 shown in the chart MOST directly supports which conclusion?",
   choices:["The American electorate has become more moderate, with the 'mixed' middle growing substantially.","The share of consistently liberal and consistently conservative Americans has grown, while the ideological center has shrunk.","Ideological change has been asymmetric — only the conservative end has grown.","The distribution of political values has remained essentially stable across the two decades."],
   correct:1,
   hint:"Compare the 'Consistently Liberal' and 'Consistently Conservative' percentages from 1994 to 2014.",
   wrongNotes:["The 'mixed' middle shrank from 49% (1994) to 39% (2014) — the opposite of growing.","CORRECT — consistently liberal grew from 3% to 12%, consistently conservative from 7% to 9%, while the mixed middle shrank from 49% to 39%.","Both ends grew: consistently liberal quadrupled (3%→12%) and consistently conservative grew (7%→9%).","The data shows substantial change — the ideological landscape shifted toward the poles."],
   explanation:"The shrinking ideological middle and growing ideological poles reflect a sorting of the electorate. As party labels increasingly align with ideology, fewer Americans hold genuinely mixed political views — reinforcing the partisan polarization visible in Congress and elections."},

  {id:219,unit:"Unit 4",topic:"4.3",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U4_05_political_engagement_by_party.png",source:"Pew Research Center, 2014 Political Polarization Study"},
   stem:"The chart showing Republican and Democratic value distributions in 1994 and 2014 BEST supports which claim about congressional lawmaking?",
   choices:["The increasing overlap between parties' value distributions makes bipartisan legislation easier.","By 2014, the median Democrat was more liberal than 94% of Republicans, and 92% of Republicans were more conservative than the median Democrat, effectively eliminating the ideological center.","Republican voters shifted dramatically left while Democratic voters moved to the right.","Both parties' distributions remained centered in the same location from 1994 to 2014."],
   correct:1,
   hint:"What does it mean for lawmaking when the medians of each party are almost entirely to one side of the other party's distribution?",
   wrongNotes:["The opposite is true — overlap nearly disappeared by 2014, making bipartisan agreement on policy almost impossible.","CORRECT — 94% of Democrats are more liberal than the median Republican, and 92% of Republicans are more conservative than the median Democrat. There is almost no ideological common ground to build bipartisan coalitions on.","Republicans moved right, Democrats moved left — both toward their respective poles.","Both distributions shifted dramatically: Republican median moved far right, Democratic median moved left."],
   explanation:"When party medians are located in the tails of the opposing party's distribution, the ideological common ground required for bipartisan lawmaking vanishes. Congressional gridlock, increased use of party-line votes, and failed legislative compromises all follow from this distributional separation."},

  // Unit 5 — Political Participation
  {id:220,unit:"Unit 5",topic:"5.1",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U5_01_voter_turnout_by_age.png",source:"Pew Research Center, 2018–2022"},
   stem:"The voter turnout patterns across three elections BEST support which conclusion about democratic participation?",
   choices:["Most American citizens are consistent voters, participating in every election.","Only 37% of citizens voted in all three elections (2018, 2020, 2022), while 30% did not vote in any — revealing that inconsistent participation is the norm.","Consistent voters are roughly evenly split between Democrats and Republicans, suggesting turnout does not favor either party.","Citizens who voted only in 2020 lean more Republican than those who voted in all three elections."],
   correct:1,
   hint:"Look at the biggest share of citizens — what voting pattern do they show?",
   wrongNotes:["Only 37% voted in all three elections — the majority are inconsistent voters.","CORRECT — consistent voting is the minority pattern (37%); inconsistent or non-voting is the majority, with 30% sitting out all three elections. This undermines the 'informed, engaged electorate' assumption.","Consistent voters split nearly evenly (49% Dem, 50% Rep), but that is not the most notable finding here.","2020-only voters split 46% Dem, 43% Rep — slightly more Democratic, not more Republican."],
   explanation:"Participation data challenges idealized democratic theory: fewer than 4 in 10 citizens voted in all three elections, while 3 in 10 voted in none. This inconsistency means electoral outcomes are shaped by a motivated minority, not the full citizenry."},

  {id:221,unit:"Unit 5",topic:"5.2",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U5_02_reasons_for_not_voting.png",source:"Pew Research Center, Nov. 2024"},
   stem:"Based on the chart on reasons for not voting, which conclusion is BEST supported?",
   choices:["Logistical barriers like inconvenience and registration problems are the top reasons nonvoters cite.","Attitudinal barriers — not thinking one's vote matters and disliking politics — are the most commonly cited major reasons for not voting.","Forgetting to vote is the leading major reason nonvoters give for their non-participation.","Registration barriers are cited as a major reason by a majority of nonvoters."],
   correct:1,
   hint:"Compare the 'A major reason' percentages across all items.",
   wrongNotes:["Inconvenience (15% major) and registration (18% major) rank below attitudinal barriers (35% and 31%). Logistical barriers are not the top reasons.","CORRECT — 'didn't think vote would make a difference' (35% major) and 'don't like politics' (31% major) outrank all logistical barriers, suggesting disillusionment more than access drives non-voting.","Only 8% cite forgetting as a major reason — the lowest of all options listed.","Only 18% cite registration as a major reason — a minority, not a majority."],
   explanation:"Non-voting is primarily attitudinal, not logistical: feelings of political inefficacy ('my vote doesn't matter') and alienation ('I don't like politics') are the dominant barriers. This challenges reform efforts focused solely on registration and access while ignoring civic disengagement."},

  {id:222,unit:"Unit 5",topic:"5.2",type:"Quantitative Analysis",difficulty:"Hard",
   stimulus:{type:"image",src:"uploads/U5_03_voter_registration_barriers.png",source:"Pew Research Center, Nov. 2024"},
   stem:"The wait time data broken down by community type BEST supports which conclusion about voting access?",
   choices:["Rural voters experience the longest wait times of any geographic group.","Urban and suburban voters are somewhat more likely to wait over 30 minutes compared to rural voters, suggesting potential disparities in polling place resources.","All demographic groups experience identical wait time distributions.","Voting before Election Day eliminates all wait times for early voters."],
   correct:1,
   hint:"Compare the 'More than 1 hour' and '31–60 minutes' combined percentages for urban, suburban, and rural voters.",
   wrongNotes:["Rural voters actually have the shortest waits — 50% waited 'not at all,' compared to 38–39% for urban/suburban voters.","CORRECT — urban (12% waited 30+ min) and suburban (14% waited 30+ min) voters face longer waits than rural voters (8%), suggesting urban polling resources may be stretched relative to demand.","Wait time distributions vary noticeably across geography, race, and age — they are not identical.","Early voters still experience waits — 14% waited over 30 minutes before Election Day."],
   explanation:"Unequal wait times across geographic and demographic groups raise Equal Protection concerns: if urban voters (who are disproportionately minority) wait longer to vote, resource allocation in polling places becomes a civil rights issue linked to meaningful ballot access."},

  {id:223,unit:"Unit 5",topic:"5.4",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U5_04_party_affiliation_by_demographics.png",source:"Pew Research Center / 2023 American Trends Panel"},
   stem:"The near-even partisan split (49% Dem/Lean Dem, 48% Rep/Lean Rep) shown in the chart has which MOST significant implication for electoral strategy?",
   choices:["Both parties should focus exclusively on turning out their base rather than appealing to swing voters.","The near-even split makes marginal shifts in turnout and persuasion among small groups highly consequential for electoral outcomes.","Third parties will inevitably capture significant vote share given the dissatisfied middle.","Electoral College outcomes are irrelevant when the national electorate is evenly split."],
   correct:1,
   hint:"If the parties are nearly tied nationally, what determines the outcome?",
   wrongNotes:["An even national split means that persuading and turning out even small segments of the electorate can decide elections — both base mobilization AND persuasion matter.","CORRECT — with a 1-point national margin (49 vs. 48), tiny advantages in specific states, demographic groups, or turnout operations can determine who wins the presidency or Senate control.","The 3% with no lean represents a very small group; structural barriers (Duverger's Law) prevent third parties from capitalizing even on this dissatisfaction.","The Electoral College is especially consequential in a near-tie — it determines who wins despite the razor-thin national margin."],
   explanation:"Near-parity in party identification means that every election is potentially decided by small margins. Campaigns invest heavily in turnout operations and targeted persuasion of persuadable voters in battleground states because even a 1–2% swing in key states can flip the Electoral College."},

  {id:224,unit:"Unit 5",topic:"5.13",type:"Quantitative Analysis",difficulty:"Medium",
   stimulus:{type:"image",src:"uploads/U5_05_news_trust_by_party.png",source:"Pew Research Center, March 2025"},
   stem:"The pattern of partisan news trust shown in the chart BEST illustrates which concept from media studies?",
   choices:["Agenda-setting: both parties prioritize the same news sources but for different reasons.","Selective exposure and partisan media trust: Republicans and Democrats trust almost entirely different news outlets, reinforcing distinct information environments.","Priming: media outlets change which issues voters prioritize based on party affiliation.","Horse race journalism: all major outlets focus on polling and electoral competition rather than policy."],
   correct:1,
   hint:"What does it mean when one party trusts a source at 56% while the other trusts it at only 19%?",
   wrongNotes:["Agenda-setting involves which issues get coverage, not which sources are trusted by different partisan groups.","CORRECT — Fox News is trusted by 56% of Republicans but only 19% of Democrats; ABC/NBC/CNN/CBS trusted by 58–61% of Democrats but only 25–26% of Republicans. These near-non-overlapping trust patterns create parallel information worlds.","Priming involves elevating certain issues to affect political evaluation — not patterns of source trust.","Horse race journalism describes a type of election coverage, not the partisan trust patterns shown here."],
   explanation:"Selective exposure — choosing media sources that confirm one's prior beliefs — produces distinct partisan information environments. When Republicans and Democrats trust almost entirely different outlets, they receive different facts, frames, and agendas, making shared political discourse and compromise increasingly difficult."},
